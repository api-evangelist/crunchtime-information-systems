apis:
- name: Crunchtime Inventory & Labor APIs
  description: >-
    REST data-integration API for Crunchtime's Inventory Management, Labor & Scheduling,
    and Cruise products. GET and POST operations move employees, locations, budgets,
    categories, products, recipes, sales/menu mix, purchase orders, inventory counts,
    time clock, forecasting, and vendor data in and out of Crunchtime. Custom
    header-based token authentication; page-based pagination; documented rate limits.
