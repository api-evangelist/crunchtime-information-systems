    GET and POST operations move employees, locations, budgets, categories, products, recipes, sales/menu
    mix, purchase orders, inventory counts, time clock, forecasting, and vendor data in and out of Crunchtime.
    Custom header-based token authentication; page-based pagination; documented rate limits.
  humanURL: https://developer.crunchtime.com/
  baseURL: https://webservices.net-chef.com
