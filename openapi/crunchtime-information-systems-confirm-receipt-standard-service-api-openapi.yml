tags:
- name: Confirm Receipt Standard Service
  description: The Confirm Receipt Standard Service allows you to create and retrieve confirmation receipts.
paths:
  /confirmreceiptstandard/v1/getAllConfirmReceiptsStandard:
    get:
      tags:
      - Confirm Receipt Standard Service
      summary: getAllConfirmReceiptsStandard
      description: Retrieve a list of Confirm Receipt details
      operationId: getAllConfirmReceiptStandardV1UsingGET
      parameters:
      - name: accountNumber
        in: query
        description: Account Number to explicitly retrieve.
        required: false
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication
        required: true
        schema:
          type: string
      - name: confirmReceiptDate
        in: query
        description: Retrieve orders with confirm receipt date equal to this date. Required if Location Code, Vendor Code and Purchase Order Number input not provided.
        required: false
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime. Required if Vendor Code, Purchase Order Number and Confirm Receipt Date Time input not provided.
        required: false
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: purchaseOrderNumber
        in: query
        description: Order Number of purchase order to retrieve. Required if Location Code, Vendor Code and Confirm Receipt Date Time input not provided.
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: trackingNumber
        in: query
        description: Tracking Number to explicitly retrieve.
        required: false
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: vendorCode
        in: query
        description: The Code number for the vendor's orders to retrieve. Required if Location Code, Purchase Order Number and Confirm Receipt Date Time input not provided.
        required: false
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfirmReceiptStandardDetailsRes'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfirmReceiptStandardDetailsRes'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: confirm receipt standard not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
