openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Storage Location Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Storage Location Service
  description: The Storage Location service offers viewing and managing data associated with primary and secondary storage locations.
paths:
  /storagelocation/v1/getAllStorageLocations:
    get:
      tags:
      - Storage Location Service
      summary: getAllStorageLocations
      description: getAllStorageLocationsV1 Implementation Notes
      operationId: getAllStorageLocationV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: centralStorageFlag
        in: query
        description: The 'Central Storage' flag for the storage location. Use true or false.
        required: false
        schema:
          type: boolean
      - name: closingIntermediary
        in: query
        description: The “Intermediary” Primary Closing Method for the storage location. Must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: closingNonInventory
        in: query
        description: The “Non-Stock” Primary Closing Method for the storage location. Must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: closingSales
        in: query
        description: The “Sales” Primary Closing Method for the storage location. Must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: closingStock
        in: query
        description: The “Stock” Primary Closing Method for the storage location. Must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: locationCode
        in: query
        description: The Code for the location associated with the storage location. Must match an existing active location in Enterprise Manager.
        required: true
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a Storage Location record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: prepStationCode
        in: query
        description: The prep station Code for the storage location.
        required: false
        schema:
          type: string
      - name: secondaryClosingIntermediary
        in: query
        description: The “Intermediary” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: secondaryClosingNonInventory
        in: query
        description: The “Non-Stock” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: secondaryClosingSales
        in: query
        description: The “Sales” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: secondaryClosingStock
        in: query
        description: The “Stock” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. test or production
        required: true
        schema:
          type: string
      - name: storageCode
        in: query
        description: The Code for the storage location.
        required: false
        schema:
          type: string
      - name: storageName
        in: query
        description: The Storage Name for the storage location. Use 2 or more characters.
        required: false
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageLocationDetails'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageLocationDetails'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Storage Location not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
