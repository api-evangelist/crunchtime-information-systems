components:
  schemas:
    StorageLocationBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        storageLocationDetails:
          type: array
          items:
            $ref: '#/components/schemas/StorageLocationDetails'
        totalPages:
          type: integer
          format: int32
      title: StorageLocationBatchResponseDto
      description: StorageLocationBatchResponseDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    StorageLocationDetails:
      type: object
      properties:
        storageLocationDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/StorageLocationDetailsDto'
      title: StorageLocationDetails
      description: StorageLocationDetails description
    StorageLocationDetailsList:
      type: object
      required:
      - locationCode
      properties:
        locationCode:
          type: string
          example: '000000'
          description: The Code for the location associated with the storage location.
        storageLocationDetails:
          type: array
          items:
            $ref: '#/components/schemas/StorageLocationDetails'
      title: StorageLocationDetailsList
      description: StorageLocationDetailsList description
    StorageLocationDetailsDto:
      type: object
      required:
      - locationCode
      - storageCode
      - storageName
      properties:
        centralStorageFlag:
          type: string
          example: Y
          description: The 'Central Storage' flag for the storage location.
          enum:
          - N
          - Y
        closingIntermediary:
          type: string
          example: B
          description: The “Intermediary” Primary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        closingNonInventory:
          type: string
          example: B
          description: The “Non-Stock” Primary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        closingSales:
          type: string
          example: B
          description: The “Sales” Primary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        closingStock:
          type: string
          example: B
          description: The “Stock” Primary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        locationCode:
          type: string
          example: '000125'
          description: The Code for the location to which the storage location is linked.
        prepStationCode:
          type: string
          example: 12333
          description: The Code for the Prep Station to which the storage location is linked.
        secondaryClosingIntermediary:
          type: string
          example: B
          description: The “Intermediary” Secondary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        secondaryClosingNonInventory:
          type: string
          example: B
          description: The “Non-Stock” Secondary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        secondaryClosingSales:
          type: string
          example: B
          description: The “Sales” Secondary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        secondaryClosingStock:
          type: string
          example: B
          description: The “Stock” Secondary Closing Method for the storage location.
          enum:
          - B
          - E
          - L
          - Z
        storageCode:
          type: string
          example: UNASGN
          description: The Code for the storage location.
        storageName:
          type: string
          example: Unassigned
          description: The Storage Name for the storage location.
      title: StorageLocationDetailsDto
      description: StorageLocationDetailsDto description
