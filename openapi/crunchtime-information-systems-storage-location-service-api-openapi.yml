      - name: secondaryClosingIntermediary
        in: query
        description: The “Intermediary” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: secondaryClosingNonInventory
        in: query
        description: The “Non-Stock” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: secondaryClosingSales
        in: query
        description: The “Sales” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: secondaryClosingStock
        in: query
        description: The “Stock” Secondary Closing Method for the storage location. must be ‘B’, ‘E’, ‘L’ or ‘Z’.
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. test or production
        required: true
        schema:
          type: string
      - name: storageCode
        in: query
        description: The Code for the storage location.
        required: false
        schema:
