components:
  schemas:
    HierarchyV1LevelDto:
      type: object
      required:
      - levelDescription
      - levelName
      - levelNumber
      properties:
        levelDescription:
          type: string
          example: Regions
          description: '"Level Description" from Hierarchy setup screen.'
        levelName:
          type: string
          example: Regions
          description: '"Level Name" from Hierarchy setup screen.'
        levelNumber:
          type: integer
          format: int64
          example: 2
          description: '"Hierarchy Level" number from Hierarchy setup screen.'
      title: HierarchyV1LevelDto
      description: Hierarchy V1 Level Dto description
    GetHierarchyV1DetailsResponse:
      type: object
      properties:
        hierarchyType:
          type: string
          example: Corporate Structure
          description: '"Hierarchy Type" (the name of the hierarchy) from Hierarchy setup screen.'
        levels:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyV1LevelDto'
        locationCode:
          type: string
          example: '129000'
          description: '"Location Code" from Hierarchy setup screen.'
        locations:
          type: array
          items:
            $ref: '#/components/schemas/HierarchyDetailDto'
      title: GetHierarchyV1DetailsResponse
      description: GetHierarchyV1DetailsResponse description
    HierarchyV1DetailsList:
      type: object
      properties:
        hierarchyDetails:
          $ref: '#/components/schemas/HierarchyV1Details'
      title: HierarchyV1DetailsList
      description: HierarchyV1DetailsList
    HierarchyHeaderDto:
      type: object
      required:
      - hierarchyType
      - locationCode
      properties:
        deleteFlag:
          type: string
          example: N
          description: '"Delete Flag" indicator. If populated, must be ‘Y'' or ''N''. If not populated, will be ''N''.'
        hierarchyType:
          type: string
          example: Corporate Structure
          description: '"Hierarchy Type" (the name of the hierarchy) from Hierarchy setup screen.'
        locationCode:
          type: string
          example: '129000'
          description: The Company "Code" from Company setup screen.
      title: HierarchyHeaderDto
      description: Creates a new Hierarchy or updates the Physical Locations of an existing Hierarchy.
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    HierarchyDetailDto:
      type: object
      required:
      - levelDescription
      - levelName
      - levelNumber
      properties:
        hasChildren:
          type: boolean
          description: Indicates whether the hierarchy has more than just one level. Valid values are 'true' or 'false'.
        levelDescription:
          type: string
          example: Regions
          description: '"Level Description" from Hierarchy setup screen.'
        levelName:
          type: string
          example: Regions
          description: '"Level Name" from Hierarchy setup screen.'
        levelNumber:
          type: integer
          format: int64
          example: 2
          description: '"Nierarchy Level" number from Hierarchy setup screen.'
        locationCode:
          type: string
          example: '300004'
          description: '"Code" for the physical location from Hierarchy setup screen.'
        locationName:
          type: string
          description: Name for the physical "Location" from Hierarchy setup screen.
        logicalName:
          type: string
          example: Northeast
          description: Name for the logical "Location" from Hierarchy setup screen.
        parentLogicalName:
          type: string
          example: Corporate
          description: Name of the "Parent Location" from Hierarchy setup screen.
      title: HierarchyDetailDto
      description: Hierarchy Detail description
    HierarchyV1Type:
      type: object
      required:
      - hierarchyType
      properties:
        hierarchyType:
          type: string
          example: Corporate Structure
          description: '"Hierarchy Type" (the name of the hierarchy) from Hierarchy setup screen.'
      title: HierarchyV1Type
      description: HierarchyV1 Type description
    HierarchyV1Details:
      type: object
      required:
      - hierarchyDetailDetails
      - hierarchyHeaderDetails
      properties:
        hierarchyDetailDetails:
          type: array
          example:
          - levelNumber: 1
            levelName: Corp
            levelDescription: Corporate
            logicalName: Corporate
            parentLogicalName: ''
            locationCode: ''
          - levelNumber: 2
            levelName: Region
            levelDescription: Regions
            logicalName: Northeast
            parentLogicalName: Corporate
            locationCode: ''
          - levelNumber: 3
            levelName: Store
            levelDescription: Stores
            logicalName: ''
            parentLogicalName: Northeast
            locationCode: '300004'
          - levelNumber: 3
            levelName: Store
            levelDescription: Stores
            logicalName: ''
            parentLogicalName: Northeast
            locationCode: '300004'
          description: '"Hierarchy Detail Details" from Hierarchy setup screen'
          items:
            $ref: '#/components/schemas/HierarchyDetailDto'
        hierarchyHeaderDetails:
          $ref: '#/components/schemas/HierarchyHeaderDto'
      title: HierarchyV1Details
      description: HierarchyV1Details description
    HierarchyV2Details:
      type: object
      required:
      - hierarchyDetailDetails
      - hierarchyHeaderDetails
      properties:
        hierarchyDetailDetails:
          type: array
          example:
          - levelNumber: 1
            levelName: Corp
            levelDescription: Corporate
            logicalName: Corporate
            parentLogicalName: ''
            locationCode: ''
          - levelNumber: 2
            levelName: Reg
            levelDescription: Regions
            logicalName: Northeast
            parentLogicalName: Corporate
            locationCode: ''
          - levelNumber: 3
            levelName: Store
            levelDescription: Stores
            logicalName: ''
            parentLogicalName: Northeast
            locationCode: Test11
          - levelNumber: 3
            levelName: Store
            levelDescription: Stores
            logicalName: ''
            parentLogicalName: Northeast
            locationCode: Test12
          description: '"hierarchyDetailDetails" from Hierarchy setup screen'
          items:
            $ref: '#/components/schemas/HierarchyDetailDto_2'
        hierarchyHeaderDetails:
          $ref: '#/components/schemas/HierarchyHeaderDto_2'
      title: HierarchyV2Details
      description: HierarchyV2Details description
    HierarchyV2DetailsList:
      type: object
      properties:
        hierarchyDetails:
          $ref: '#/components/schemas/HierarchyV2Details'
      title: HierarchyV2DetailsList
      description: HierarchyV2DetailsList description
    HierarchyHeaderDto_2:
      type: object
      required:
      - hierarchyType
      - locationCode
      properties:
        deleteFlag:
          type: string
          example: N
          description: '"deleteFlag" from Hierarchy setup screen'
        hierarchyType:
          type: string
          example: HierarchyType1
          description: '"hierarchyType" from Hierarchy setup screen'
        locationCode:
          type: string
          example: '000000'
          description: '"locationCode" from Hierarchy setup screen'
      title: HierarchyHeaderDto
      description: Hierarchy Header description
    HierarchyV2LevelDto:
      type: object
      required:
      - levelDescription
      - levelName
      - levelNumber
      properties:
        levelDescription:
          type: string
          example: Regions
          description: '"levelDescription" from Hierarchy setup screen.'
        levelName:
          type: string
          example: Reg
          description: '"levelName" from Hierarchy setup screen.'
        levelNumber:
          type: integer
          format: int64
          example: 2
          description: '"levelNumber" from Hierarchy setup screen.'
      title: HierarchyV2LevelDto
      description: Hierarchy V2 Level Dto description
    HierarchyDetailDto_2:
      type: object
      required:
      - levelDescription
      - levelName
      - levelNumber
      properties:
        hasChildren:
          type: boolean
          description: '"hasChildren" from Hierarchy setup screen'
        levelDescription:
          type: string
          example: Regions
          description: '"levelDescription" from Hierarchy setup screen'
        levelName:
          type: string
          example: Reg
          description: '"levelName" from Hierarchy setup screen'
        levelNumber:
          type: integer
          format: int64
          example: 2
          description: '"levelNumber" from Hierarchy setup screen'
        locationCode:
          type: string
          example: '000000'
          description: '"locationCode" from Hierarchy setup screen'
        locationName:
          type: string
          description: '"locationName" from Hierarchy setup screen'
        logicalName:
          type: string
          example: Northeast
          description: '"logicalName" from Hierarchy setup screen'
        parentLogicalName:
          type: string
