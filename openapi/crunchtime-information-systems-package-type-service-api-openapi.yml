  /packagetype/v2/savePackageTypes:
    post:
      tags:
      - Package Type Service
      summary: savePackageTypesV2
      description: Create or Update Package Type records
      operationId: savePackageTypesV2UsingPOST
      parameters:
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageTypeV2DetailsList'
        description: packageDetails
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: object
            application/json:
              schema:
                type: object
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
components:
  schemas:
    PackageTypeV2DetailsList:
      type: object
      required:
      - locationCode
      properties:
        locationCode:
          type: string
          example: '000000'
          description: '"Code" from Company setup screen.'
        packageTypeDetails:
          type: array
          items:
            $ref: '#/components/schemas/PackageTypeV2Details'
      title: PackageTypeV2DetailsList
      description: PackageTypeV2DetailsList description
    PackageTypeV2BatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        packageTypeDetails:
          type: array
          items:
            $ref: '#/components/schemas/PackageTypeDetailsGet'
        totalPages:
          type: integer
          format: int32
      title: PackageTypeV2BatchResponseDto
      description: PackageTypeV2BatchResponseDto description
    PackageTypeDetailsGet:
      type: object
      properties:
        packageTypeDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/PackageTypeDetailGet'
      title: PackageTypeDetailsGet
      description: PackageTypeDetailsGet description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    PackageTypeDetailGet:
      type: object
      properties:
        ediUnitCode:
          type: string
          example: BG
          description: '"EDI Unit Code" from Package Types setup screen.'
        ediUnitDescription:
          type: string
          example: Bag
          description: '"EDI Unit Description" from Package Types setup screen.'
        packageDescription:
          type: string
          example: WHOLE PINEAPPLE
          description: '"Package Description" from Package Types setup screen.'
        packageInventory:
          type: string
          example: Y
          description: '"Inventory" Package flag from Package Types setup screen.'
        packageLineCheck:
          type: string
          example: Y
          description: '"Line Check" Package flag from Package Types setup screen.'
        packagePurchasing:
          type: string
          example: Y
          description: '"Purchasing" Package flag from Package Types setup screen.'
        packageRecipe:
          type: string
          example: Y
          description: '"Recipe" Package flag from Package Types setup screen.'
        packageType:
          type: string
          example: WHOLE PINEAPPLE
          description: '"Package Type" name from Package Types setup screen.'
      title: PackageTypeDetailGet
      description: PackageTypeDetailGet description
    PackageTypeDetailDto:
      type: object
      required:
      - packageDescription
      - packageType
      properties:
        ediUnitCode:
          type: string
          example: BG
          description: '"EDI Unit Code" from Package Types setup screen. This field can be used to link a unit code used in Xchange to an existing Package Type in Enterprise Manager.'
        packageDescription:
          type: string
          example: WHOLE PINEAPPLE
          description: '"Package Description" from Package Types setup screen. Must not exceed 25 characters. No Duplicate package type descriptions allowed.'
        packageInventory:
          type: string
          example: Y
          description: '"Inventory" Package flag from Package Types setup screen. It can be selected as an Inventory Unit, Issue Unit, Alternate Count Unit, Weight Unit, and Volume Unit for a Company Product; as an Alternate Count Unit for a Location Product; and as a Weight Unit and Volume Unit for a Recipe''s Company Product record. Must have at least one Package Type in the database with a Package Inventory value of ‘Y’ after all updates, including creates.'
        packageLineCheck:
          type: string
          example: Y
          description: '"Line Check" Package flag from Package Types setup screen. It can be associated with products being monitored in the Line Check mobile application and/or as the Default Storage Container for a recipe.'
        packagePurchasing:
          type: string
          example: Y
          description: '"Purchasing" Package flag from Package Types setup screen. It can be selected as Primary or Secondary Vendor Unit for a Vendor Bid, and as a Preferred Vendor Pack Type for a Company Product or a Recipe''s Company Product record. Must have at least one Package Type in the database with a Package Purchasing value of ‘Y’ after all updates, including creates.'
        packageRecipe:
          type: string
          example: Y
          description: '"Recipe" Package flag from Package Types setup screen. It can be selected as a Recipe Unit for a Company Product; a Batch Unit, Portion Unit, Issue Unit and Recipe Unit for a Recipe; and as an Inventory Unit, Issue Unit, and Alternate Count Unit for a Recipe''s Company Product record. Must have at least one Package Type in the database with a Package Recipe value of ‘Y’ after all updates, including creates.'
        packageType:
          type: string
          example: WHOLE PINEAPPLE
          description: '"Package Type" name from Package Types setup screen. This is the field used to determine if a new package type is added or an existing package type is updated. Must not exceed 20 characters. Must not have duplicate field in other records in the file'
      title: PackageTypeDetailDto
      description: PackageTypeDetailDto description
    PackageTypeV2Details:
      type: object
      properties:
        packageTypeDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/PackageTypeDetailDto'
      title: PackageTypeV2Details
      description: PackageTypeV2Details description
