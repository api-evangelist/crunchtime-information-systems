openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Package Type Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Package Type Service
  description: The Package Type Service offers a way to create, update, and retrieve package type entries.
paths:
  /packagetype/v2/getAllPackageTypes:
    get:
      tags:
      - Package Type Service
      summary: getAllPackageTypesV2
      description: Retrieve a list of Package Types
      operationId: getAllPackageTypesV2UsingGET
      parameters:
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: ediUnitCode
        in: query
        description: This field links a unit code used in Xchange to an existing Package Type in Enterprise Manager. Exact Match ex. BG
        required: false
        schema:
          type: string
      - name: ediUnitDescription
        in: query
        description: This field links a unit description used in Xchange to an existing Package Type in Enterprise Manager. Use 3 or more characters
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a package type record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: packageDescription
        in: query
        description: Package Description setup in Enterprise Manager. Use 2 or more characters
        required: false
        schema:
          type: string
      - name: packageInventory
        in: query
        description: "If true, the package type can be selected as an Inventory Unit, Issue Unit, Alternate Count Unit, Weight Unit, and Volume Unit for a Company Product; as an Alternate Count Unit for a Location Product; and as a Weight Unit and Volume Unit for a Recipe's Company Product record.\n\nTrue = include all package types with inventory checked\n\nFalse = do not include all package types with inventory checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packageLineCheck
        in: query
        description: "If true, the package type can be associated with products being monitored in the Line Check mobile application and/or as the Default Storage Container for a recipe.\n\nTrue = include all package types with line check checked\n\nFalse = do not include all package types with line check checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packagePurchasing
        in: query
        description: "If true, the package type can be selected as Primary or Secondary Vendor Unit for a Vendor Bid, and as a Preferred Vendor Pack Type for a Company Product or a Recipe's Company Product record.\n\nTrue = include all package types with purchasing checked\n\nFalse = do not include all package types with purchasing checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packageRecipe
        in: query
        description: "If true, the package type can be selected as a Recipe Unit for a Company Product; a Batch Unit, Portion Unit, Issue Unit and Recipe Unit for a Recipe; and as an Inventory Unit, Issue Unit, and Alternate Count Unit for a Recipe's Company Product record.\n\nTrue = include all package types with recipe checked\n\nFalse = do not include all package types with recipe checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packageType
        in: query
        description: Package Type name setup in Enterprise Manager. Use 2 or more characters
        required: false
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageTypeDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PackageTypeDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Package Type not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /packagetype/v2/getPackageTypesByPage:
    get:
      tags:
      - Package Type Service
      summary: getPackageTypesByPageV2
      description: Retrieve a list of Package Types by `pageNumber`
      operationId: getPackageTypesByPageV2UsingGET
      parameters:
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: ediUnitCode
        in: query
        description: This field links a unit code used in Xchange to an existing Package Type in Enterprise Manager. Exact Match ex. BG
        required: false
        schema:
          type: string
      - name: ediUnitDescription
        in: query
        description: This field links a unit description used in Xchange to an existing Package Type in Enterprise Manager. Use 3 or more characters
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a package type record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: packageDescription
        in: query
        description: Package Description setup in Enterprise Manager. Use 2 or more characters
        required: false
        schema:
          type: string
      - name: packageInventory
        in: query
        description: "If true, the package type can be selected as an Inventory Unit, Issue Unit, Alternate Count Unit, Weight Unit, and Volume Unit for a Company Product; as an Alternate Count Unit for a Location Product; and as a Weight Unit and Volume Unit for a Recipe's Company Product record.\n\nTrue = include all package types with inventory checked\n\nFalse = do not include all package types with inventory checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packageLineCheck
        in: query
        description: "If true, the package type can be associated with products being monitored in the Line Check mobile application and/or as the Default Storage Container for a recipe.\n\nTrue = include all package types with line check checked\n\nFalse = do not include all package types with line check checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packagePurchasing
        in: query
        description: "If true, the package type can be selected as Primary or Secondary Vendor Unit for a Vendor Bid, and as a Preferred Vendor Pack Type for a Company Product or a Recipe's Company Product record.\n\nTrue = include all package types with purchasing checked\n\nFalse = do not include all package types with purchasing checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packageRecipe
        in: query
        description: "If true, the package type can be selected as a Recipe Unit for a Company Product; a Batch Unit, Portion Unit, Issue Unit and Recipe Unit for a Recipe; and as an Inventory Unit, Issue Unit, and Alternate Count Unit for a Recipe's Company Product record.\n\nTrue = include all package types with recipe checked\n\nFalse = do not include all package types with recipe checked \n\nAll = include the entire package types\n\nDefault = All"
        required: false
        schema:
          type: string
      - name: packageType
        in: query
        description: Package Type name setup in Enterprise Manager. Use 2 or more characters
        required: false
        schema:
          type: string
      - name: pageNumber
        in: query
        description: 'Provide the page number to retrieve Application Users on a particular page.

          Default is 1 when no ''pageNumber'' value provided.'
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: pageSize
        required: false
        schema:
          type: integer
          format: int32
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PackageTypeV2BatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/PackageTypeV2BatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
