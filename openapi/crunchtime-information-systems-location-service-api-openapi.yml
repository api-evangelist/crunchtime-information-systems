openapi: 3.2.0
info:
  title: Crunchtime Information Systems Location Service API
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
  termsOfService: http://springfox.io
  version: '1.0'
  description: 'Operations tagged Location Service across 2 of this provider''s published API definitions: crunchtime-information-systems-cruise-platform-openapi.yml, crunchtime-information-systems-inventory-labor-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Location Service
  description: The Locations Service allows you to review and configure general information about each location (restaurant, venue etc.) such as the address and phone number, as well as detailed preference settings regarding the location’s post settings, associated concepts, codes used to align Crunchtime with other systems, labor details and more.
paths:
  /cruise/location/v1/getAllLocations:
    get:
      tags:
      - Location Service
      summary: getAllLocationsV1
      description: Retrieve a list of all Locations.
      operationId: getAllLocationsV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: Use `true` to retrieve only active Locations.
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: corporate
        in: query
        description: Use 'true' to retrieve "Location" data for the Company location only.
        required: false
        schema:
          type: boolean
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a location record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: market
        in: query
        description: Market Name from main location record
        required: false
        schema:
          type: string
      - name: city
        in: query
        description: Code for the City associated with this location
        required: false
        schema:
          type: string
      - name: stateProvince
        in: query
        description: Code for the State/Province associated with this location
        required: false
        schema:
          type: string
      - name: country
        in: query
        description: Code for the Country associated with this location
        required: false
        schema:
          type: string
      - name: franchiseCode
        in: query
        description: Links the location to a specific franchise
        required: false
        schema:
          type: string
      - name: exportCode
        in: query
        description: Export Code for the location, from the Alternate Address tab
        required: false
        schema:
          type: string
      - name: payrollExportCode
        in: query
        description: ''
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: Specifies the field used to sort the Locations. Default is 'locationCode ' if not provided (Optional)
        required: false
        example: 'locationCode '
        schema:
          type: string
          enum:
          - 'locationCode '
          - locationName
          - city
          - lastUpdated
          - lastEditDate
          - createDate
          - lastEditUser
          - market
          - franchiseCode
      - name: sortOrder
        in: query
        description: 'Specifies the sort direction for Locations: ascending (ASC) or descending (DESC). Default is ASC if not specified (Optional)'
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
