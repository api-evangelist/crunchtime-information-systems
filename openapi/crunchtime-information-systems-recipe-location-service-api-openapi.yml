      - name: recipePrice
        in: query
        description: Displays the Ideal Price per Portion from the Recipes…Modeling tab in Enterprise Manager. In the Recipe API the analogous field is called “price”.
        required: false
        schema:
          type: number
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
