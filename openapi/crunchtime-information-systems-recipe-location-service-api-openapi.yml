components:
  schemas:
    RecipeLocationHeaderDto:
      type: object
      properties:
        pluNumber:
          type: integer
          format: int64
          example: 10004
          description: '"PLU Number" from Recipe Screen'
        productNumber:
          type: string
          example: 103141
          description: '"Product Number" from Recipe Screen'
        recipeName:
          type: string
          example: CTest Recipe 1
          description: '"Recipe Name" from Recipe Screen'
      title: RecipeLocationHeaderDto
      description: RecipeLocationHeaderDto description
    RecipeLocationDetailsDto:
      type: object
      required:
      - locationCode
      - productNumber
      properties:
        activeFlag:
          type: string
          example: N
          description: '"Active Flag" from Recipe Screen''s Location Tab'
          enum:
          - N
          - Y
        atCostItem:
          type: string
          example: N
          description: '"A/T Cost Item" from Recipe Screen''s Location Tab'
          enum:
          - N
          - Y
        locationCode:
          type: string
          example: 7654
          description: '"Location Code" from Recipe Screen''s Location Tab'
        pluNumber:
          type: integer
          format: int64
          example: 10004
          description: '"PLU Number" from Recipe Screen''s Location Tab'
        posDecrement:
          type: string
          example: I
          description: '"POS Decrement" from Recipe Screen''s Location Tab'
          enum:
          - C
          - I
        prepReportFlag:
          type: string
          example: Y
          description: '"Prep Report Flag" from Recipe Screen''s Location Tab'
          enum:
          - N
          - Y
        productNumber:
          type: string
          example: 103141
          description: '"Product Number" from Recipe Screen'
        productionType:
          type: string
          example: P
          description: '"Production Type" from Recipe Screen''s Location Tab'
          enum:
          - O
          - P
        recipeName:
          type: string
          example: CTest Rcp Location 1
          description: '"Recipe Location Name" from Recipe Screen''s Location Tab'
        recipePrice:
          type: number
          example: 5.67
          description: '"Recipe Price" from Recipe Screen''s Location Tab'
      title: RecipeLocationDetailsDto
      description: RecipeLocationDetailsDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    RecipeLocationDetailsGet:
      type: object
      properties:
        recipeLocationDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLocationDetailGet'
        recipeLocationHeaderDetails:
          $ref: '#/components/schemas/RecipeLocationHeaderDto'
      title: RecipeLocationDetailsGet
      description: RecipeLocationDetailsGet description
    RecipeLocationDetails:
      type: object
      properties:
        recipeLocationDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLocationDetailsDto'
        recipeLocationHeaderDetails:
          $ref: '#/components/schemas/RecipeLocationHeaderDto'
      title: RecipeLocationDetails
      description: RecipeLocationDetails description
    RecipeLocationBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
          example: true
          description: has Next
        recipeLocationDetails:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLocationDetailsGet'
        totalPages:
          type: integer
          format: int32
          example: 10
          description: Total Pages
      title: RecipeLocationBatchResponseDto
      description: RecipeLocationBatchResponseDto description
    RecipeLocationDetailGet:
      type: object
      required:
      - locationCode
      - productNumber
      properties:
        activeFlag:
          type: string
          example: N
          description: '"Active Flag" from Recipe Screen''s Location Tab'
          enum:
          - N
          - Y
        atCostItem:
          type: string
          example: N
          description: '"A/T Cost Item" from Recipe Screen''s Location Tab'
          enum:
          - N
          - Y
        lastTouchDate:
          type: string
          example: 10/12/2022 12:48:36
          description: '"Last Touch Date" from Recipe Screen''s Location Tab'
        locationCode:
          type: string
          example: 7654
          description: '"Location Code" from Recipe Screen''s Location Tab'
        pluNumber:
          type: integer
          format: int64
          example: 10004
          description: '"PLU Number" from Recipe Screen''s Location Tab'
        posDecrement:
          type: string
          example: I
          description: '"POS Decrement" from Recipe Screen''s Location Tab'
          enum:
          - C
          - I
        prepReportFlag:
          type: string
          example: Y
          description: '"Prep Report Flag" from Recipe Screen''s Location Tab'
          enum:
          - N
          - Y
        productNumber:
          type: string
          example: 103141
          description: '"Product Number" from Recipe Screen'
        productionType:
          type: string
          example: P
          description: '"Production Type" from Recipe Screen''s Location Tab'
          enum:
          - O
          - P
        recipeName:
          type: string
          example: CTest Rcp Location 1
          description: '"Recipe Location Name" from Recipe Screen''s Location Tab'
        recipePrice:
          type: number
          example: 5.67
          description: '"Recipe Price" from Recipe Screen''s Location Tab'
      title: RecipeLocationDetailGet
      description: RecipeLocationDetailGet description
    RecipeLocationDetailsList:
      type: object
      properties:
        locationCode:
          type: string
          example: '000000'
          description: '"Code" from Company setup screen'
        recipeLocationDetails:
          type: array
          items:
            $ref: '#/components/schemas/RecipeLocationDetails'
      title: RecipeLocationDetailsList
      description: RecipeLocationDetailsList description
