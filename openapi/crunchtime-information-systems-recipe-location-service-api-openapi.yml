      - name: pluNumber
        in: query
        description: Retrieve a Recipe's specific PLU Number. The PLU links the recipe to the point-of-sale system and allows ingredients to be depleted from inventory based on sales. This query param will search both the actual pluNumber (header) OR Location plu Number.
        required: false
