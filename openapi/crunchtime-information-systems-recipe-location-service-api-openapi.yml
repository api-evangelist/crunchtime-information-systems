openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Recipe Location Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Recipe Location Service
  description: The Recipe Location Service allows you to create and retrieve location specific recipes.
paths:
  /recipelocation/v1/getAllRecipeLocations:
    get:
      tags:
      - Recipe Location Service
      summary: getAllRecipeLocations
      description: Get All Recipe Locations
      operationId: getAllRecipeLocationV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: This indicates whether or not the recipe is available to each location.
        required: false
        schema:
          type: boolean
      - name: atCostItem
        in: query
        description: If yes, the Actual/Theoretical Cost report will display costs for the recipe item (not its components) at the specified location.  Analogous field in Recipe API is “calcAtCost”.
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a recipe location record was last updated. Use to set how far back to search. Required if recipeName, productNumber and pluNumber input not provided.
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: pluNumber
        in: query
        description: Retrieve a Recipe's specific PLU Number. The PLU links the recipe to the point-of-sale system and allows ingredients to be depleted from inventory based on sales. This query param will search both the actual pluNumber (header) OR Location plu Number. Required if recipeName, productNumber and minutesSinceUpdate input not provided.
        required: false
        schema:
          type: integer
          format: int64
      - name: posDecrement
        in: query
        description: This determines how quantities will be depleted from inventory when a recipe product is sold.
        required: false
        schema:
          type: string
      - name: prepReportFlag
        in: query
        description: This indicates whether or not the recipe is eligible to be included in the Net-Chef Prep Report at this location.
        required: false
        schema:
          type: boolean
      - name: productionType
        in: query
        description: 'This determines whether component ingredients from the location will be used to make this recipe. '
        required: false
        schema:
          type: string
      - name: productNumber
        in: query
        description: The Product Number of the Recipe to retrieve. Required if recipeName, pluNumber and minutesSinceUpdate input not provided.
        required: false
        schema:
          type: string
      - name: recipeName
        in: query
        description: This is the recipe name and can be different names at different locations. Use 3 or more characters. This query param will search both the actual recipe name (header) OR recipe location name. Required if productNumber, pluNumber and minutesSinceUpdate input not provided.
        required: false
        schema:
          type: string
      - name: recipePrice
        in: query
        description: Displays the Ideal Price per Portion from the Recipes…Modeling tab in Enterprise Manager. In the Recipe API the analogous field is called “price”.
        required: false
        schema:
          type: number
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeLocationDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecipeLocationDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: recipe location not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /recipelocation/v1/getRecipeLocationsByPage:
