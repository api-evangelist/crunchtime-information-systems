          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RecipeLocationBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/RecipeLocationBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
