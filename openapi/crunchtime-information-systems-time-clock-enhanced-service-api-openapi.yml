components:
  schemas:
    TimeClockEnhancedDetailsGet:
      type: object
      properties:
        timeClockEnhancedDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/TimeClockEnhancedDetailGet'
        timeClockEnhancedHeaderDetails:
          $ref: '#/components/schemas/TimeClockEnhancedHeaderDto'
      title: TimeClockEnhancedDetailsGet
      description: TimeClockEnhancedDetailsGet description
    TimeClockEnhancedDetailGet:
      type: object
      required:
      - clockIn
      - completeFlag
      - employeeNumber
      - exportFlag
      - hoursAdjusted
      - hoursOtAdjusted
      - laborDate
      - locationId
      - locationIdWorked
      - payRateReg
      - posCode
      - posId
      - valueAdjusted
      - valueOtAdjusted
      - valueRegAdjusted
      - weekEndingDate
      properties:
        breakType:
          type: string
          example: PAID
          description: Indicates whether the employee clocked in/out for either a 'Paid' or 'Unpaid' break during their shift.
          enum:
          - 'NULL'
          - PAID
          - UNPAID
        cashSales:
          type: number
          example: 99999999.9999
          description: Cash Sales for the shift.
        cashTips:
          type: number
          example: 99999999.9999
          description: Shared declared Cash Tips for the shift.
        chargeSales:
          type: number
          example: 99999999.9999
          description: Charge Sales for the shift.
        chargeTips:
          type: number
          example: 99999999.99
          description: Declared Charge Tips for the shift.
        clockIn:
          type: string
          example: HH:mm MM/dd/yyyy
          description: Adjusted Clock In Date/Time for the shift.
        clockOut:
          type: string
          example: HH:mm MM/dd/yyyy
          description: Adjusted Clock Out Date/Time for the shift.
        clopeningPayRateOr:
          type: number
          example: 99999999.9999
          description: The rate of pay used to calculate a Clopening premium.
        clopeningShiftHoursDiffOr:
          type: number
          example: 99999999.9999
          description: The difference in hours between the end of the first shift (in the logical shift grouping) and the beginning of the second shift (in the logical shift grouping).
        clopeningValueOr:
          type: number
          example: 99999999.9999
          description: The Clopening premium value for the shift.
        completeFlag:
          type: string
          example: Y
          description: Indicates whether the shift is complete.
          enum:
          - N
          - Y
        editedBy:
          type: string
          description: The User ID for the user that reviewed/edited the shift records.
        employeeNumber:
          type: string
          example: AUTO52
          description: POS ID of the employee who worked the shift.
        exportFlag:
          type: string
          example: Y
          description: Indicates whether the shift has been exported.
          enum:
          - N
          - Y
        hoursAdjusted:
          type: number
          example: 99999999.9999
          description: Total hours for the shift (Adjusted Begin to Adjusted End minus Adjusted Minutes).
        hoursMealPeriodPremiumOr:
          type: number
          example: 99999999.9999
          description: Number of hours for the Meal Period premium.
        hoursMinPaidShiftOr:
          type: number
          example: 99999999.9999
          description: Number of hours for the Minimum Paid Shift premium.
        hoursOtAdjusted:
          type: number
          example: 99999999.9999
          description: Total Overtime Hours for the shift.
        hoursPaidBreakOr:
          type: number
          example: 99999999.9999
          description: Total Paid Break hours for the shift.
        hoursRegAdjusted:
          type: number
          example: 99999999.9999
          description: Total Regular hours for the shift.
        hoursReportingPayOr:
          type: number
          example: 99999999.9999
          description: Total Reporting Pay hours for the shift.
        hoursSplitShiftOr:
          type: number
          example: 99999999.9999
          description: Total Split Shift hours for the shift.
        laborDate:
          type: string
          example: MM/dd/yyyy
          description: Date the shift was worked.
        locationId:
          type: integer
          format: int64
          example: PL8
          description: Location Code for the location where the shift was worked.
        locationIdWorked:
          type: integer
          format: int64
          example: PL8
          description: Location Code for the location where the shift was allocated to, if different from where the shift was worked.
        payRateReg:
          type: number
          example: 99999999.9999
          description: Regular Pay Rate for the shift.
        payType:
          type: string
          example: H
          description: Pay Type for the position worked for the shift. 'S' (Salary), 'E' (Salary Exempt), or ‘H' (Hourly)
          enum:
          - E
          - H
          - S
        payrollCode:
          type: string
          example: Q1
          description: Payroll Code Code that identifies the position.
        posCode:
          type: string
          example: AUTO10
          description: POS Code that identifies the position.
        posId:
          type: string
          example: 247087
          description: POS ID that identifies the employee.
        posted:
          type: string
          example: N
          description: Indicates whether the labor record has been posted.
        rateMealPeriodPremium:
          type: number
          example: 99999999.9999
          description: Rate at which the Meal Period premium is paid.
        rateMinPaidShift:
          type: number
          example: 99999999.9999
          description: Rate used for Minimum Paid Shift penalty value calculation.
        ratePaidBreakPremium:
          type: number
          example: 99999999.9999
          description: Rate at which the Paid Break premium is paid.
        rateReportingPay:
          type: number
          example: 99999999.9999
          description: Rate used for Reporting Pay penalty value calculation.
        rateSplitShiftOr:
          type: number
          example: 99999999.9999
          description: Rate used for Split Shift penalty value calculation.
        reviewed:
          type: string
          example: Y
          description: Indicates whether the shift row has been reviewed in the Net-Chef Labor Details screen.
        spreadOfHrsAwardedHoursOr:
          type: number
          example: 99999999.9999
          description: 'Number of hours awarded if employee works greater than or equal to the Spread of Hours minimum # of hours.'
        spreadOfHrsRate:
          type: number
          example: 99999999.9999
          description: Rate at which the Spread of Hours premium is paid.
        spreadOfHrsValue:
          type: number
          example: 99999999.9999
          description: Spread of Hours premium paid for the shift.
        tippedCreditValueOr:
          type: number
          example: 99999999.9999
          description: Tipped Credit value paid for the shift.
        valueAdjusted:
          type: number
          example: 99999999.9999
          description: Total Pay value for the shift.
        valueMealPeriodPremium:
          type: number
          example: 99999999.9999
          description: Meal Period premium paid for the shift.
        valueMinPaidShift:
          type: number
          example: 99999999.9999
          description: Minimum Paid Shift premium paid for the shift.
        valueOtAdjusted:
          type: number
          example: 99999999.9999
          description: Total Overtime pay for the shift.
        valuePaidBreak:
          type: number
          example: 99999999.9999
          description: Paid Break premium paid for the shift.
        valueRegAdjusted:
          type: number
          example: 99999999.9999
          description: Total Regular pay for the shift.
        valueReportingPay:
          type: number
          example: 99999999.9999
          description: Reporting Pay premium paid for the shift.
        valueSplitShift:
          type: number
          example: 99999999.9999
          description: Split Shift premium paid for the shift.
        weekEndingDate:
          type: string
          example: MM/dd/yyyy
          description: Week Ending Date for the labor week.
      title: TimeClockEnhancedDetailGet
      description: TimeClockEnhancedDetailGet description
    TimeClockEnhancedHeaderDto:
      type: object
      required:
      - importDataDateTime
      - laborDate
      - locationCode
      properties:
        importDataDateTime:
          type: string
          example: HH:mm MM/dd/yyyy
          description: Import Date/Time for the labor records.
        laborDate:
          type: string
          example: MM/dd/yyyy
          description: The date for the labor records in the file.
        locationCode:
          type: string
          example: '000000'
          description: The location code for the labor records in the file.
      title: TimeClockEnhancedHeaderDto
      description: TimeClockEnhancedHeaderDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    TimeClockEnhancedDetailDto:
      type: object
      required:
      - clockIn
      - clockOut
      - employeeNumber
      - posCode
      properties:
        breakType:
          type: string
          example: PAID
          description: Indicates whether the employee clocked in/out for either a 'Paid' or 'Unpaid' break during their shift.
          enum:
          - 'NULL'
          - PAID
          - UNPAID
        cashSales:
          type: number
          example: 99999999.9999
          description: Cash Sales for the shift.
        cashTips:
          type: number
          example: 99999999.9999
          description: Shared declared Cash Tips for the shift.
        chargeSales:
          type: number
          example: 99999999.9999
          description: Charge Sales for the shift.
        chargeTips:
          type: number
          example: 99999999.99
          description: Declared Charge Tips for the shift.
        clockIn:
          type: string
          example: HH:mm MM/dd/yyyy
          description: Adjusted Clock In Date/Time for the shift.
        clockOut:
          type: string
          example: HH:mm MM/dd/yyyy
          description: Adjusted Clock Out Date/Time for the shift.
        editedBy:
          type: string
          description: The User ID for the user that reviewed/edited the shift records.
        employeeNumber:
          type: string
          example: AUTO52
          description: POS ID of the employee who worked the shift.
        posCode:
          type: string
          example: AUTO10
          description: POS Code that identifies the position.
      title: TimeClockEnhancedDetailDto
      description: TimeClockEnhancedDetailDto description
    TimeClockEnhancedDetailsList:
      type: object
      properties:
        timeClockEnhancedDetails:
          type: array
          items:
            $ref: '#/components/schemas/timeClockEnhancedDetails'
      title: TimeClockEnhancedDetailsList
      description: TimeClockEnhancedDetailsList description
    timeClockEnhancedDetails:
      type: object
      properties:
        timeClockEnhancedDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/TimeClockEnhancedDetailDto'
        timeClockEnhancedHeaderDetails:
          $ref: '#/components/schemas/TimeClockEnhancedHeaderDto'
      title: timeClockEnhancedDetails
      description: timeClockEnhancedDetails description
    TimeClockEnhancedBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        timeClockEnhancedDetails:
          type: array
          items:
            $ref: '#/components/schemas/timeClockEnhancedDetails'
        totalPages:
          type: integer
          format: int32
      title: TimeClockEnhancedBatchResponseDto
      description: TimeClockEnhancedBatchResponseDto description
