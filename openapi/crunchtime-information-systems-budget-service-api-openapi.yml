openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Budget Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Budget Service
  description: The Budgets Service allows you to create and retrieve budgets for each post period at each location. Budget figures for each General Ledger can be entered either as currency values or as percentages. Budget values and calculations are used in the Profit and Loss reports, which compare actual sales and costs to what was budgeted.
paths:
  /budget/v1/getAllBudget:
    get:
      tags:
      - Budget Service
      summary: getAllBudget
      description: Retrieves all Budget records for the Location and Post Date.
      operationId: getAllBudgetV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: The Post date in format dd-MMM-yy.
        required: true
        example: 04-JUN-12
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetDetails'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetDetails'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: BUDGET_NOT_FOUND
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /budget/v1/getBudgetByPage:
    get:
      tags:
      - Budget Service
      summary: getBudgetByPage
      description: 'Retrieves Budget records for the Location, and Post Date, by `pageNumber`.

        Use to retrieve data in smaller chunks.'
      operationId: getBudgetByPageV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: "Retrieve one or more records by `pageNumber`. \n Use to retrieve data in smaller chunks. \n If left blank, the default is `1`."
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: The Post date in format dd-MMM-yy.
        required: true
        example: 04-JUN-12
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of items to display per page.
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BudgetBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: BUDGET_NOT_FOUND
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /budget/v1/saveBudget:
    post:
      tags:
      - Budget Service
      summary: saveBudget
      description: 'Create one or more budget records.

        Update one or more budget records.

        Update a budget item.'
      operationId: saveBudgetUsingPOST
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetDetailsList'
        description: List of budget details.
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: object
            application/json:
              schema:
                type: object
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
components:
  schemas:
    BudgetDetails:
      type: object
      properties:
        budgetDetailDetails:
          type: array
          description: Budget item details.
          items:
            $ref: '#/components/schemas/BudgetDetailsDto'
        budgetHeaderDetails:
          $ref: '#/components/schemas/BudgetHeaderDto'
      title: BudgetDetails
      description: BudgetDetails description
    BudgetDetailsDto:
      type: object
      required:
      - glDescription
      - glNumber
      - percentOfAccount
      properties:
        budgetType:
          type: string
          example: P
          description: General Ledger budget value type. Must be ‘V’ for currency value or ‘P’ for percentage of another General Ledger account, P&L Substructure or P&L Grouping budget value.
          enum:
          - P
          - V
        budgetValue:
          type: number
          example: 0.36
          description: The value budgeted for the General Ledger account.
        glDescription:
          type: string
          example: CLEANING SUPPLIES
          description: General Ledger category name.  Required and referenced only when “GL Number” corresponds to a “GL Number” in more than one Crunchtime General Ledger account.
        glNumber:
          type: string
          example: 687501
          description: ' General Ledger account number.'
        percentLevel:
          type: string
          example: 3
          description: "Percentage level grouping type. \n `1` = General ledger \n `2` = null \n `3` = Profit & Loss Grouping, \n `4` = Profit & Loss Substructure."
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
        percentOfAccount:
          type: string
          example: SLS
          description: General Ledger grouping for the account.  Required and referenced only when Budget Type = ‘P’ (“Percentage of”).
      title: BudgetDetailsDto
      description: BudgetDetailsDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    BudgetHeaderDto:
      type: object
      description: Budget header item.
      required:
      - postDate
      properties:
        postDate:
          type: string
          example: MM/dd/yyyy
          description: Post Date for the Budget record.
      title: Budget Header
    BudgetDetailsList:
      type: object
      required:
      - locationCode
      properties:
        budgetDetails:
          type: array
          description: List of budget items and their details.
          items:
            $ref: '#/components/schemas/BudgetDetails'
        locationCode:
          type: string
          example: '000000'
          description: Company Code for site name.
      title: BudgetDetailsList
      description: BudgetDetailsList description
    BudgetBatchResponseDto:
      type: object
      properties:
        budgetDetails:
          type: array
          items:
            $ref: '#/components/schemas/BudgetDetails'
        hasNext:
          type: boolean
        totalPages:
          type: integer
          format: int32
      title: BudgetBatchResponseDto
      description: BudgetBatchResponseDto description
