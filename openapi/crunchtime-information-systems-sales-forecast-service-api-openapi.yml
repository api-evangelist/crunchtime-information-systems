openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Sales Forecast Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Sales Forecast Service
  description: The Sales Forecasts Service can be used to ensure that Sales Forecasting data aligns between Crunchtime and other systems. You can use the service to get Forecast data that has been systematically calculated based on a Location's Suggested Order configuration or post a Sales Forecast, overriding the systemcalculated value.
paths:
  /salesforecast/v1/15-minutes/getSalesForecast:
