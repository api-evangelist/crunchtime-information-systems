components:
  schemas:
    SalesForecastDayDetailsList:
      type: object
      properties:
        locationsForecast:
          type: array
          items:
            $ref: '#/components/schemas/SalesForecastDayDetails'
      title: SalesForecastDayDetailsList
      description: List of forecasts grouped by locations
    SalesForecastDetails:
      type: object
      required:
      - locationCode
      properties:
        forecasts:
          type: array
          items:
            $ref: '#/components/schemas/SalesForecastDto'
        locationCode:
          type: string
          example: 120012
          description: '"locationCode" from salesforecast'
      title: SalesForecastDetails
      description: Contains forecasts for multiple periods for a single location
    SalesForecastError:
      type: object
      required:
      - errorMessage
      properties:
        errorMessage:
          type: string
          example: Revenue Center with Code '1sss' does not exist in the database.
          description: '"errorMessage"'
        locationCode:
          type: string
          example: 120012
          description: '"locationCode" from salesforecast'
      title: SalesForecastError
      description: Sales Forecast errors
    SalesForecastBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        locationsForecast:
          type: array
          items:
            $ref: '#/components/schemas/SalesForecastDetails'
        totalPages:
          type: integer
          format: int32
      title: SalesForecastBatchResponseDto
      description: List of forecasts grouped by locations divided into pages
    SalesForecastDetailsList:
      type: object
      properties:
        locationsForecast:
          type: array
          items:
            $ref: '#/components/schemas/SalesForecastDetails'
      title: SalesForecastDetailsList
      description: List of forecasts grouped by locations
    SalesForecastDayDto:
      type: object
      required:
      - forecastDate
      properties:
        checks:
          type: number
          example: 14
          description: '"checks" from salesforecast'
        forecastDate:
          type: string
          example: 09/02/2024
          description: '"forecastDate" from salesforecast'
        guests:
          type: number
          example: 13
          description: '"guests" from salesforecast'
        sales:
          type: number
          example: 12
          description: '"sales" from salesforecast'
      title: SalesForecastDayDto
      description: Representation of single day forecast for sales, guests and checks
    SalesForecastDto:
      type: object
      required:
      - revenueCenterCode
      - startTime
      properties:
        checks:
          type: number
          example: 14
          description: '"checks" from salesforecast'
        guests:
          type: number
          example: 13
          description: '"guests" from salesforecast'
        revenueCenterCode:
          type: string
          example: BS002
          description: '"revenueCenterCode" from salesforecast'
        sales:
          type: number
          example: 12
          description: '"sales" from salesforecast'
        startTime:
          type: string
          example: 12:00 09/02/2024
          description: '"startTime" from salesforecast'
      title: SalesForecastDto
      description: Representation of single period sales, guests and checks forecast in a revenue center
    SalesForecastDayDetails:
      type: object
      required:
      - locationCode
      properties:
        forecasts:
          type: array
          items:
            $ref: '#/components/schemas/SalesForecastDayDto'
        locationCode:
          type: string
          example: 120012
          description: '"locationCode" from salesforecast'
      title: SalesForecastDayDetails
      description: Contains forecasts for multiple periods for a single location
