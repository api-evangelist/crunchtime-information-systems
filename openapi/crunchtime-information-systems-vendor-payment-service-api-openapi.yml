components:
  schemas:
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    VendorPaymentDetailsDto:
      type: object
      required:
      - checkDate
      - checkNumber
      - discountAmount
      - discountGLCode
      - invoiceNumber
      - vendorCode
      properties:
        checkAmount:
          type: number
          example: 140
          description: '"checkAmount" from Vendor Payment.'
        checkDate:
          type: string
          example: 03/13/2024
          description: '"checkDate" from Vendor Payment'
        checkNumber:
          type: string
          example: paythis
          description: '"checkNumber" from Vendor Payment'
        discountAmount:
          type: number
          example: -36.6
          description: '"discountAmount" from Vendor Payment.'
        discountGLCode:
          type: string
          example: 687501
          description: '"discountGLCode" from Vendor Payment'
        invoiceAllocationAmount:
          type: number
          example: 13.5
          description: '"invoiceAllocationAmount" from Vendor Payment.'
        invoiceNumber:
          type: string
          example: 129
          description: '"invoiceNumber" from Vendor Payment'
        locationCode:
          type: string
          example: '000122'
          description: '"locationCode" from Vendor Payment'
        transactionNumber:
          type: string
          example: vo-10050
          description: '"transactionNumber" from Vendor Payment'
        vendorCode:
          type: string
          example: 17
          description: '"vendorCode" from Vendor Payment'
      title: VendorPaymentDetailsDto
      description: VendorPaymentDetailsDto description
    VendorPaymentBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        totalPages:
          type: integer
          format: int32
        vendorPaymentDetails:
          type: array
          items:
            $ref: '#/components/schemas/VendorPaymentDetails'
      title: VendorPaymentBatchResponseDto
      description: VendorPaymentBatchResponseDto description
    VendorPaymentDetails:
      type: object
      properties:
        vendorPaymentDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/VendorPaymentDetailsDto'
      title: VendorPaymentDetails
      description: VendorPaymentDetails description
