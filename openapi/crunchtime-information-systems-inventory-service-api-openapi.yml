openapi: 3.2.0
info:
  title: Crunchtime Information Systems Inventory Service API
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
  termsOfService: http://springfox.io
  version: '1.0'
  description: 'Operations tagged Inventory Service across 2 of this provider''s published API definitions: crunchtime-information-systems-cruise-platform-openapi.yml, crunchtime-information-systems-inventory-labor-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Inventory Service
  description: 'The Inventory Service combines a series of get and post calls used to update and review the quantity and value of a location stock on hand including:

    -Inventory Adjustments (Waste)

    -Value Adjustments

    -Physical Inventory Counts'
paths:
  /cruise/inventory/inventoryadjustment/v1/getAllInventoryAdjustments:
    get:
      tags:
      - Inventory Service
      summary: getAllInventoryAdjustments
      description: Retrieve inventory adjustments (waste transactions) by date and location.
      operationId: getAllInventoryAdjustmentV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: componentRecipeAdjustmentFlag
        in: query
        description: Recipe Adjustment. When `true` indicates a recipe adjustment, when `false` indicates an inventory adjustment.
        required: false
        schema:
          type: boolean
      - name: daypartCode
        in: query
        description: The code for the Daypart associated with the adjustment.
        required: false
        schema:
          type: string
      - name: entryDate
        in: query
        description: Date of transaction adjustment in format DD-MMM-YY.
        required: true
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Retrieve all the details of the inventory adjustment. Fetch the details only if transaction number is provided.
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: true
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a inventory adjustment record was last updated. Use to set how far back to search.
        required: false
        example: 1440
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: transactionNumber
        in: query
        description: Transaction number associated to the entry in Crunchtime.
        required: false
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryAdjustmentDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryAdjustmentDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: inventory adjustment not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
    servers:
    - url: //webservices-test.net-chef.com
