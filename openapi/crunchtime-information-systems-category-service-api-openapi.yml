components:
  schemas:
    CategoryDetailsDto:
      type: object
      required:
      - categoryName
      - glDescription
      properties:
        categoryName:
          type: string
          example: CTEST-CAT
          description: The Name of the Category in Enterprise Manager.
        glDescription:
          type: string
          example: test GL
          description: The General Ledger Description associated with the Category.
        microcategoryName:
          type: string
          example: CTEST-MICRO
          description: The name of the Microcategory associated with the Category and Subcategory. Required once you opt to use a Microcategory for any Category record.
        subcategoryName:
          type: string
          example: CTEST-SUB
          description: 'The name of the Subcategory associated with the Category. Required once you opt to use a Subcategory for any Category record. '
      title: CategoryDetailsDto
      description: CategoryDetailsDto description
    CategoryDetailsList:
      type: object
      properties:
        categoryDetails:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDetails'
        locationCode:
          type: string
          example: '000000'
          description: '"Code" from Company setup screen.'
      title: CategoryDetailsList
      description: CategoryDetailsList description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    CategoryDetailGet:
      type: object
      required:
      - categoryName
      - glDescription
      properties:
        categoryName:
          type: string
          example: CTEST-CAT
          description: The Name of the Category in Enterprise Manager.
        glDescription:
          type: string
          example: test GL
          description: The General Ledger Description associated with the Category.
        glNumber:
          type: string
          example: 1245485
          description: The General Ledger Number associated with the Category.
        microcategoryName:
          type: string
          example: CTEST-MICRO
          description: The name of the Microcategory associated with the Category and Subcategory.
        subcategoryName:
          type: string
          example: CTEST-SUB
          description: The name of the Subcategory associated with the Category.
      title: CategoryDetailGet
      description: CategoryDetailGet description
    CategoryBatchResponseDto:
      type: object
      properties:
        categoryDetails:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDetailsGet'
        hasNext:
          type: boolean
          example: true
          description: has Next
        totalPages:
          type: integer
          format: int32
          example: 10
          description: Total Pages
      title: CategoryBatchResponseDto
      description: CategoryBatchResponseDto description
    CategoryDetails:
      type: object
      properties:
        categoryDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDetailsDto'
      title: CategoryDetails
      description: CategoryDetails description
    CategoryDetailsGet:
      type: object
      properties:
        categoryDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/CategoryDetailGet'
      title: CategoryDetailsGet
      description: CategoryDetailsGet description
