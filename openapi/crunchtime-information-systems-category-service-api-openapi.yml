servers:
- url: //webservices-test.net-chef.com
tags:
- name: Category Service
  description: The Category Service allows you to create and retrieve product categories.
paths:
  /category/v1/getAllCategories:
    get:
      tags:
      - Category Service
      summary: getAllCategories
      description: Retrieve a list of Categories
      operationId: getAllCategoryV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: categoryName
        in: query
        description: This is the Category Name in Enterprise Manager. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: glDescription
        in: query
        description: This is General Ledger Description. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: glNumber
        in: query
        description: This is General Ledger Number.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: microcategoryName
        in: query
        description: This is Micro Category Name associated with the Sub Category. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a category record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: subcategoryName
        in: query
        description: This is Sub Category Name associated with the Category. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: category not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /category/v1/getCategoriesByPage:
    get:
      tags:
      - Category Service
      summary: getCategoriesByPage
      description: Retrieve a list of Categories by page number
      operationId: getCategoryByPageV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: categoryName
        in: query
        description: This is the Category Name in Enterprise Manager. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: glDescription
        in: query
        description: This is General Ledger Description. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: glNumber
        in: query
        description: This is General Ledger Number.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: microcategoryName
        in: query
        description: This is Micro Category Name associated with the Sub Category. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a category record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: 'Provide the page number to retrieve Application Users on a particular page.

          Default is 1 when no ''pageNumber'' value provided.'
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: pageSize
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: subcategoryName
        in: query
        description: This is Sub Category Name associated with the Category. Use 3 or more characters.
        required: false
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
