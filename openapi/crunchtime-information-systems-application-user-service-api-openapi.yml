components:
  schemas:
    AppUserHierarchyDetailDto:
      type: object
      required:
      - consolidatedDashboardFlag
      - hierarchyType
      - limitExportLocationsFlag
      - locationCode
      - logicalName
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Hierarchy record.'
          enum:
          - N
          - Y
        consolidatedDashboardFlag:
          type: string
          example: N
          description: '"Consolidated Dashboard" flag from the application user Hierarchy details.'
          enum:
          - N
          - Y
        hierarchyType:
          type: string
          example: customer
          description: '"hierarchy Type" from the application user Hierarchy details.'
        limitExportLocationsFlag:
          type: string
          example: N
          description: '"Limit Export Locations" flag from the application user Hierarchy details.'
          enum:
          - N
          - Y
        locationCode:
          type: string
          example: '000000'
          description: '"Location" Code for the Hierarchy from the application user Hierarchy details.'
        logicalName:
          type: string
          example: logicName
          description: Parent "Logical Name" for the Hierarchy from the application user Hierarchy details.
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
      title: AppUserHierarchyDetailDto
      description: AppUserHierarchyDetailDto description
    AppUserPasswordDetailDto:
      type: object
      required:
      - password
      - userId
      properties:
        password:
          type: string
          example: I@123
          description: Password for the Crunchtime Application User.
        userId:
          type: string
          example: 1233
          description: '"User ID" from the application user details.'
      title: AppUserPasswordDetailDto
      description: AppUserPasswordDetailDto description
    ApplicationUserBatchResponseDto:
      type: object
      properties:
        applicationUserDetails:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationUserDetailsGet'
        hasNext:
          type: boolean
        totalPages:
          type: integer
          format: int32
      title: ApplicationUserBatchResponseDto
    CdpError:
      type: object
      properties:
        errorMessage:
          type: string
        fieldNumber:
          type: integer
          format: int32
        lineNumber:
          type: integer
          format: int32
        parentFileLineNumber:
          type: integer
          format: int32
      title: CdpError
    AppUserDailyAlertDetailDto:
      type: object
      required:
      - emailFormat
      - hierarchyType
      - locationCode
      - logicalName
      - reportName
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Daily Alert record.'
          enum:
          - N
          - Y
        emailFormat:
          type: string
          example: user@crunchtime.com
          description: '"E-mail Format" setting from the application user Daily Alert details. Must be ‘T’ (Text) or ‘I’ (Image).'
        hierarchyType:
          type: string
          example: '001'
          description: '"Hierarchy" Type from the application user Daily Alert details.'
        locationCode:
          type: string
          example: '0000'
          description: '"Location" Code for the Hierarchy from the application user Daily Alert details.'
        logicalName:
          type: string
          example: crunchtime
          description: Location "Logical Name" for the Hierarchy from the application user Daily Alert details.
        reportName:
          type: string
          example: test
          description: '"Report" name from the application user Daily Alert details.'
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
      title: AppUserDailyAlertDetailDto
      description: AppUserDailyAlertDetailDto description
    AppUserDepartmentDetailDto:
      type: object
      required:
      - activeFlag
      - locationCode
      - locationDepartment
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Department record.'
        approvalAuthority:
