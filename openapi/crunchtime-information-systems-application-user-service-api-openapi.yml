        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationUserDetails'
        description: Application user details.
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: object
