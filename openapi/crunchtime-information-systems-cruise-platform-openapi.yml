tags:
- name: Application User Service
  description: The Application User service is used to create and retrieve user profiles where each user is assigned a unique User ID and password for logging in to Enterprise Manager, Net-Chef, or the Teamworx Manager Console.   It links users to specific locations, hierarchies, customers and markets, and assigns each user to a user group, which determines which screens and tasks the user will be able to access in the applications.
- name: Company Product Enhanced Service
  description: The Company Product Service allows you to create and retrieve the global, above store list of products that can be used elsewhere in the application, including recipe components (see the Recipe Enhanced Service) or as Location Products (see the Location Product Pricing Service). Company Products can also be referred to as Items or Ingredients.
- name: Currency Ratio Service
  description: "The Currency Ratios Service is used to enter the exchange rates that will to convert monetary values from one currency to another. The \"toCurrencyCode\" is equal to the base currency in Enterprise Manager, then enter the exchange rate to convert the \"fromCurrencyCode\" to that base currency. \n**Note**: A Currency Ratio cannot be established until that Currency has been configured as the base currency for a location, vendor, or market."
- name: Customer Service
  description: The Customer Service can be used to create a “Customer” that is an establishment or outlet to which a Crunchtime Location sells or distributes products and/or produced Recipe items. It may be an outlet within the Location or an entirely external entity, e.g. a “catering” Customer. “Customer” records are required to “issue” items to these entities via “Customer Order” transactions.
- name: General Ledger Service
  description: The General Ledger services allows the Crunchtime applications to be aligned with the company’s accounting and bookkeeping systems. General Ledger codes and descriptions are associated with P&L groupings and substructures.
- name: Hierarchy Service
  description: The Hierarchy Service is used to group locations together for reporting purposes. For example, if the company is a national restaurant chain divided into six regions, setting up the hierarchy configuration allows each regional manager to view revenue, cost and consumption data (reports) only for the stores in his or her region. To associate a user, such as the regional manager, to a specific hierarchy, reference the Application User Service.
- name: Inventory Service
  description: "The Inventory Service combines a series of get and post calls used to update and review the quantity and value of a location stock on hand including:\n -Inventory Adjustments (Waste)\n -Value Adjustments\n -Physical Inventory Counts"
- name: Location Service
  description: The Locations Service allows you to review and configure general information about each location (restaurant, venue etc.) such as the address and phone number, as well as detailed preference settings regarding the location’s post settings, associated concepts, codes used to align Crunchtime with other systems, labor details and more.
- name: Projected Consumption Service
  description: The Projected Consumption service is used to get Consumption data that has been systematically calculated based on a Location's Suggested Order configuration, or post Projected Consumption, overriding the system calculated value. Projected Consumption data is used to help a location choose how much to purchase from a vendor or how much to prep for the day.
- name: Recipe Enhanced Service
  description: The Recipe Service is used to create or extract recipe data including the header and component details. Recipes are created in Crunchtime for the purpose of inventory depletion. They are used to deplete Products through POS sales (See the Check Menu Mix Service for addition details) and through the production of prep items.
- name: Scheduled Export Service
  description: The Scheduled Export service is an API that Crunchtime customers can use to download export files that have been generated via Scheduled Events in Enterprise Manager and convert the file content to JSON.
- name: Vendor Location Service
  description: ' The Vendor Location Service enables for quick setup of vendor locations for companies with large amounts of locationspecific information per vendor, such as payment terms, order minimums, email addresses, etc.'
- name: Vendor Service
  description: The Vendor Service is used to create/review records of all Vendors that can be used to record expenses in Crunchtime. Typically, a third-party system is the system of record for Vendors and vendor data is posted to Crunchtime. Once created, additional configuration is required within Enterprise Manager to ensure stores can place and receive Vendor Orders or record Simple Receipt and Purchase by Invoice (PBI) transactions.
