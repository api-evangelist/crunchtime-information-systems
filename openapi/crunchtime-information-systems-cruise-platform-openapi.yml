openapi: 3.0.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '3.05'
  title: Cruise Platform
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
externalDocs:
  description: Using CrunchTime APIs Documentation
  url: https://links.crunchtime.com/SG-UsingCrunchtimeAPIs?pd01=api
servers:
- url: //webservices-test.net-chef.com
paths:
  /cruise/applicationuser/v1/getAllApplicationUsers:
    get:
      tags:
      - Application User Service
      summary: getAllApplicationUsers
      description: 'Retrieve a list of Application Users, with limited information (e.g. Active status and User Group assignment).

        Retrieve this information about a single Application User, with additional details (e.g. User/Location(s), User/Market(s), etc.) by using the `userIdForDetails` and `includeDetails` fields.'
      operationId: getAllApplicationUsersV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: 'Use `true` to limit retrieval to active Application Users.

          Use `false` to limit retrieval to inactive Application Users.

          Omit to retrieve all Application Users.'
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Use `true` to retrieve detailed information for a single Application User by using the user id as the `userIdForDetails` parameter value.
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: userIdForDetails
        in: query
        description: 'Provide the `userId` for a specific Application User to limit retrieval of that Application User''s information.

          Add `includeDetails = true` for complete Application User information.'
        required: false
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since an application user record was last updated. Use to set how far back to search.
        required: false
        example: 1440
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationUserDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationUserDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /cruise/applicationuser/v1/getApplicationUsersByPage:
    get:
      tags:
      - Application User Service
      summary: getApplicationUsersByPage
      description: 'Retrieve a list of Application Users across multiple pages.

        Include additional details (e.g. User/Locations(s), User/Market(s), etc.) for a single Application User or all Application Users by using the `includeDetails` parameter.

        Default page size is 10 Application Users, including their details if `includeDetails` is `true`.'
      operationId: getApplicationUsersByPageV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: 'Use `true` to limit retrieval to active Application Users.

          Use `false` to limit retrieval of inactive Application Users.

          Omit to retrieve all Application Users.'
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Use `true` to retrieve detailed information for each Application User.
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: pageNumber
        in: query
        description: 'Provide the page number to retrieve Application Users on a particular page.

          Default is 1 when no ''pageNumber'' value provided.'
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: Number of items to display per page.
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: userIdForDetails
        in: query
        description: 'Provide the `userId` for a specific Application User to limit retrieval of that Application User''s information.

          Add `includeDetails = true` for complete Application User information.'
        required: false
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since an application user record was last updated. Use to set how far back to search.
        required: false
        example: 1440
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationUserBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationUserBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
