components:
  schemas:
    AppUserBizIQDetailDto:
      type: object
      required:
      - bizIqAccessLevel
      - userId
      properties:
        bizIqAccessLevel:
          type: string
          example: C
          description: '"BizIQ User Access" level from the application user details.'
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
      title: AppUserBizIQDetailDto
      description: AppUserBizIQDetailDto description
    AppUserConceptDetailDto:
      type: object
      required:
      - activeFlag
      - conceptCode
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Concept record.'
          enum:
          - N
          - Y
        conceptCode:
          type: string
          example: code
          description: '"Concept Code" from the application user Concept details.'
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
      title: AppUserConceptDetailDto
      description: AppUserConceptDetailDto description
    AppUserConsolidationVendorDetailDto:
      type: object
      required:
      - activeFlag
      - userId
      - vendorCode
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Consolidation Vendor record.'
          enum:
          - N
          - Y
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
        vendorCode:
          type: string
          example: vendorCode
          description: '"Vendor Code" from the application user Consolidation Vendor details.'
      title: AppUserConsolidationVendorDetailDto
      description: AppUserConsolidationVendorDetailDto description
    AppUserCustomerDetailDto:
      type: object
      required:
      - activeFlag
      - customer
      - locationCode
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Customer record.'
          enum:
          - N
          - Y
        customer:
          type: string
          example: customer
          description: '"Customer Code" from the application user Customer details.'
        locationCode:
          type: string
          example: '0000'
          description: '"Location Code" for the Location associated with the Customer, from the application user Customer details.'
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
      title: AppUserCustomerDetailDto
      description: AppUserCustomerDetailDto description
    AppUserDailyAlertDetailDto:
      type: object
      required:
      - emailFormat
      - hierarchyType
      - locationCode
      - logicalName
      - reportName
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Daily Alert record.'
          enum:
          - N
          - Y
        emailFormat:
          type: string
          example: user@crunchtime.com
          description: '"E-mail Format" setting from the application user Daily Alert details. Must be ‘T’ (Text) or ‘I’ (Image).'
        hierarchyType:
          type: string
          example: '001'
          description: '"Hierarchy" Type from the application user Daily Alert details.'
        locationCode:
          type: string
          example: '0000'
          description: '"Location" Code for the Hierarchy from the application user Daily Alert details.'
        logicalName:
          type: string
          example: crunchtime
          description: Location "Logical Name" for the Hierarchy from the application user Daily Alert details.
        reportName:
          type: string
          example: test
          description: '"Report" name from the application user Daily Alert details.'
        userId:
          type: string
          example: 1
          description: '"User ID" from the application user details.'
      title: AppUserDailyAlertDetailDto
      description: AppUserDailyAlertDetailDto description
    AppUserDepartmentDetailDto:
      type: object
      required:
      - activeFlag
      - locationCode
      - locationDepartment
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag for the User/Department record.'
        approvalAuthority:
          type: string
          example: Authority
          description: '"Approval Authority" flag from the application user Department details.'
        approvalLimit:
          type: integer
          format: int64
          example: 112334212
          description: '"Approval Limit" from the application user Department details.'
        locationCode:
          type: string
          example: '000000'
          description: '"Location Code" for the Location associated with the Department, from the application user Department details.'
        locationDepartment:
          type: string
          example: crunchtime
          description: '"location Department" name from the application user Department details.'
        userId:
          type: string
          example: 1233
          description: '"User ID" from the application user details.'
      title: AppUserDepartmentDetailDto
      description: AppUserDepartmentDetailDto description
    AppUserDetailDto:
      type: object
      required:
      - activeFlag
      - email
      - firstName
      - lastName
      - newHireFlag
      - userGroup
      - userId
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"Active" flag from the application user ''User'' tab.'
          enum:
          - N
          - Y
        email:
          type: string
          example: John@gmail.com
          description: '"E-mail" address from the application user ''User'' tab.'
        employeeNumber:
          type: string
          example: AUTO-0000000005
          description: '"Employee Record" number from the application user ''User'' tab.'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CdpError'
        ext:
          type: string
          example: '+12'
          description: Telephone "Ext" from the application user 'User' tab.
        firstName:
          type: string
          example: acf
          description: '"First Name" from the application user ''User'' tab.'
        hhUserFlag:
          type: string
          example: Y
          description: '"Hand-held User Flag" from the application user ''User'' tab.'
          enum:
          - N
          - Y
        hhUserId:
          type: string
          example: 12321
          description: '"Hand-held User ID" from the application user ''User'' tab.'
        hhUserPassword:
          type: string
          example: 12@hi
          description: '"Hand-held User Password" from the application user ''User'' tab.'
