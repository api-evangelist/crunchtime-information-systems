openapi: 3.2.0
info:
  title: Crunchtime Information Systems Scheduled Export Service API
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
  termsOfService: http://springfox.io
  version: '1.0'
  description: 'Operations tagged Scheduled Export Service across 2 of this provider''s published API definitions: crunchtime-information-systems-cruise-platform-openapi.yml, crunchtime-information-systems-inventory-labor-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Scheduled Export Service
  description: The Scheduled Export service is an API that Crunchtime customers can use to download export files that have been generated via Scheduled Events in Enterprise Manager and convert the file content to JSON.
paths:
  /cruise/scheduledexport/v1/downloadScheduledExport:
    get:
      tags:
      - Scheduled Export Service
      summary: downloadScheduledExport
      description: Download Scheduled Exports. To ensure the highest stability and data integrity for your API integration, we strongly recommend using a sequential or "low-parallelism" pattern when downloading scheduled exports from the Crunchtime API. Because these exports often involve large datasets, initiating multiple concurrent downloads can lead to resource contention, resulting in throttled throughput or connection timeouts. By limiting your process to a single active download at a time, you allow the platform to provide a steady, high-speed data stream without the overhead of managing competing requests. This "one-at-a-time" approach is the most reliable way to ensure your files are delivered completely and efficiently, preventing the need for complex error handling or manual restarts.
      operationId: downloadScheduledExportsV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: batchNumber
        in: query
        description: Batch Number of the export file to download. Obtained from ‘getAllScheduledExports’.
        required: true
        schema:
          type: string
      - name: exportType
        in: query
        description: 'Export file type of the export file to download. Obtained from ‘getAllScheduledExports’. '
        required: true
        schema:
          type: string
      - name: extractHistoryId
        in: query
        description: Unique file identifier of the export file to download. Obtained from ‘getAllScheduledExports’.
        required: true
        schema:
          type: string
      - name: includeVendorOrderAttachments
        in: query
        description: "Output includes Vendor Order and Purchase by Invoice file attachments (invoices, images) when true, for Accounts Payable files only (exportType = MAPPABLE_AP_TRANS_TYPE). \n File attachments are downloaded in base64 format. Note that file attachments will not be available for files after “Undo” in Outbound Integrations."
        required: false
        schema:
          type: boolean
          default: true
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportFile'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportFile'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Scheduled export not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
    servers:
    - url: //webservices-test.net-chef.com
  /cruise/scheduledexport/v1/getAllScheduledExports:
    get:
      tags:
      - Scheduled Export Service
      summary: getAllScheduledExportsV1
      description: 'Retrieve a list of individual export files generated through Event Scheduling (Scheduled Exports) or manually in Outbound Integrations. Does not include files associated with managed partner integrations.

        Results may be used with the downloadScheduledExport endpoint to retrieve file contents, and with the markScheduledExport endpoint to update export file records to indicate that they have been downloaded.'
      operationId: getAllScheduledExportsV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: exportDate
        in: query
        description: Export Date to retrieve in format DD-MMM-YY.
        required: false
        schema:
          type: string
      - name: exportStatus
        in: query
        description: "Export Status to retrieve. If null, all Exports meeting the criteria of the Query Params will be returned. Statuses are: \n(1) Returns records for manually created exports; \n(2) Returns records for Scheduled Export files ready for download; \n(3) Returns records for Scheduled Export files already downloaded by CDP or any files “marked” as downloaded; \n(5) Returns records Marked as not successfully downloaded."
        required: false
        schema:
          type: string
      - name: extractName
        in: query
        description: Export file type name to explicitly retrieve. These file type names appear in parentheses in the “Transaction Type” column in Outbound Integrations.
        required: false
        schema:
          type: string
      - name: fileName
        in: query
        description: Specific export file name to explicitly retrieve. Use 4 or more characters for wildcard search. Note that these file names are not visible in the Outbound Integrations screen.
        required: false
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: Post Date to retrieve in format DD-MMM-YY.
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: userIdForDetails
        in: query
        description: All export files are associated with a particular Application User's User ID. This is the value displayed in the “User” column in Outbound Integrations for the relevant file or file batch.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: exportType
        in: query
        description: "General export file type to explicitly retrieve. File types are: \nMAPPABLE_AP_TRANS_TYPE (Accounts Payable), \nMAPPABLE_SALES_TYPE (Sales), \nMAPPABLE_INVENTORY_TOTALS_TYPE (Inventory Totals), \nMAPPABLE_INVENTORY_DELTA_TYPE (Inventory Delta), \nMAPPABLE_LOC_TRANSFERS_TYPE (Location Transfers), \nMAPPABLE_AR_TRANS_TYPE (Accounts Receivable), \nMAPPABLE_CUSTOM_TRANS_TYPE (Custom Transactions), \nEMPLOYEE_MAINTENANCE (Employee Maintenance), \nMAPPABLE_EMPLOYEE_POS_TYPE (Employee POS), \n MAPPABLE_LABOR_SCHEDULE_TYPE (Labor Schedule), \nMAPPABLE_PAYROLL_TYPE (Payroll), \nUSER_DEFINED (User Defined)"
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledBatchExportFiles'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduledBatchExportFiles'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Scheduled export not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
    servers:
    - url: //webservices-test.net-chef.com
