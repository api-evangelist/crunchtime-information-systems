openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Authentication Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Authentication Service
  description: The Authentication Service is allowing to validate user access to a franchisee site using a username and password.
paths:
  /ces-auth/validate-user:
    post:
      tags:
      - Authentication Service
      summary: validate-user
      description: Validate user access to a franchisee site using a username and password.
      operationId: validateUserUsingPOST
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: false
        schema:
          type: string
      - in: header
        name: X-B3-TraceId
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: requestBody
      responses:
        '200':
          description: Pass
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult'
            application/json:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult'
        '400':
          description: Fail - Validation Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-400'
            application/json:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-400'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-400'
        '401':
          description: Fail - Authentication Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-401'
            application/json:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-401'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-401'
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
            application/json;charset=UTF-8:
              schema:
                type: string
        '500':
          description: Fail - Unexpected Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-500'
            application/json:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-500'
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/CesAuthenticationResult-500'
        '503':
          description: Site temporarily down
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
            application/json;charset=UTF-8:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
            application/json;charset=UTF-8:
              schema:
                type: string
components:
  schemas:
    CesAuthenticationResult:
      type: object
      required:
      - result
      properties:
        result:
          type: string
          example: Pass
          description: Result of CES authentication
          enum:
          - '"Fail"'
          - '"Pass"'
      title: CesAuthenticationResult
      description: Authentication Result from CES
    CesAuthenticationResult-401:
      type: object
      required:
      - result
      properties:
        detail:
          type: string
          example: Unauthorized
          description: Detail of authentication failure
        result:
          type: string
          example: Fail
          description: Result of CES authentication
          enum:
          - '"Fail"'
          - '"Pass"'
      title: CesAuthenticationResult-401
      description: Authentication Result with Http Status Code 401
    CesAuthenticationResult-500:
      type: object
      required:
      - result
      properties:
        detail:
          type: string
          example: Site https://ces-auto-margqa-2-5-nc.mynet-chef.com is currently unavailable
          description: Detail of authentication failure
        result:
          type: string
          example: Fail
          description: Result of CES authentication
          enum:
          - '"Fail"'
          - '"Pass"'
      title: CesAuthenticationResult-500
      description: Authentication Result with Http Status Code 500
    CesAuthenticationResult-400:
      type: object
      required:
      - result
      properties:
        detail:
          type: string
          example: Missing required header input "password"
          description: Detail of authentication failure
        result:
          type: string
          example: Fail
          description: Result of CES authentication
          enum:
          - '"Fail"'
          - '"Pass"'
      title: CesAuthenticationResult-400
      description: Authentication Result with Http Status Code 400
