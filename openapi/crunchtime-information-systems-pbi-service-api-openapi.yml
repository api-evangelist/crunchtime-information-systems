components:
  schemas:
    PbiHeaderDto:
      type: object
      required:
      - deliveryDate
      - invoiceDate
      - invoiceNumber
      - invoiceTotal
      - vendorCode
      properties:
        checkNumber:
          type: string
          example: '1701'
          description: Check Number used to pay the invoice.
        deliveryDate:
          type: string
          format: date
          example: 12/14/2025
          description: Date the product was delivered or service performed.
        invoiceDate:
          type: string
          format: date
          example: 12/14/2025
          description: Date the vendor issued the invoice.
        invoiceNumber:
          type: string
          example: '74205'
          description: Invoice Number from the vendor's invoice.
        invoiceTotal:
          type: number
          example: 15
          description: Total value for the entire invoice.
        locationCode:
          type: string
          example: '100122'
          description: Code or Name for the Location. Must match an active Location in Enterprise Manager.
        vendorCode:
          type: string
          example: '100700'
          description: Must match a Location Export Code, Export Code, or Code for an active Vendor in Enterprise Manager.
      title: PbiHeaderDto
      description: PbiHeaderDto description
    PbiDetailsGet:
      type: object
      properties:
        pbiDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/PbiDetailDto'
        pbiHeaderDetails:
          $ref: '#/components/schemas/PbiHeaderDtoGet'
      title: PbiDetailsGet
      description: PbiDetailsGet description
    PbiHeaderDtoGet:
      type: object
      required:
      - deliveryDate
      - invoiceDate
      - invoiceNumber
      - invoiceTotal
      - vendorCode
      properties:
        checkNumber:
          type: string
          example: '1701'
          description: Check Number used to pay the invoice.
        deliveryDate:
          type: string
          format: date
          example: 12/14/2025
          description: Date the product was delivered or service performed.
        invoiceDate:
          type: string
          format: date
          example: 12/14/2025
          description: Date the vendor issued the invoice.
        invoiceNumber:
          type: string
          example: '74656'
          description: Invoice Number from the vendor's invoice.
        invoiceTotal:
          type: number
          example: 15
          description: Total value for the entire invoice.
        locationCode:
          type: string
          example: '100122'
          description: Code or Name for the Location. Must match an active Location in Enterprise Manager.
        vendorCode:
          type: string
          example: '100700'
          description: Must match a Location Export Code, Export Code, or Code for an active Vendor in Enterprise Manager.
        transactionStatus:
          type: integer
          format: int32
          example: '3'
          description: 'Indicates the transaction status: 7 for Awaiting Reconcile, 3 for Reconciled, 4 for Cancelled, and 12 for Awaiting Allocation.'
        postInventoryScheduledDate:
          type: string
          example: 12/14/2025
          description: Post Date for Purchase by Invoice transaction
        reconcileDate:
          type: string
          example: 12/14/2025
          description: Date the invoice was reconciled
      title: PbiHeaderDtoGet
      description: PbiHeaderDtoGet description
    PbiDetailDto:
      type: object
      required:
      - category
      - detailAmount
      - microcategory
      - subcategory
      properties:
        category:
          type: string
          example: NON-FOOD
          description: Must match an existing Category in Enterprise Manager.
        detailAmount:
          type: number
          example: 15
          description: Total value of this item row.
        detailMemo:
          type: string
          example: Purchased Cleaning Supplies
          description: Description of the product delivered or service performed.
        glNumber:
          type: string
          example: 704701
          description: Must match an existing GL Number in Enterprise Manager.
        microcategory:
          type: string
          example: PAPER TOWELS
          description: Must match an existing Microcategory in Enterprise Manager.  Required if “Link GL to” Preference is “Microcategory”
        subcategory:
          type: string
          example: PAPER GOODS
          description: Must match an existing Subcategory in Enterprise Manager.  Required if “Link GL to” Preference is “Subcategory” or “Microcategory”
      title: PbiDetailDto
      description: PbiDetailDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    PbiAttachmentDto:
      type: object
      properties:
        locationCode:
          type: string
          description: Location Code of the attachment file.
          example: LOC123
        fileName:
          type: string
          description: File name associated with the attachment.
          example: IMG_6717.JPG
        fileDescription:
          type: string
          description: File description associated with the attachment.
          example: Delivery photo
        fileSize:
          type: integer
          format: int64
          description: File Size of the attachment file (in KB).
          example: 20
        fileUrl:
          type: string
          description: Downloadable file url starts with https://download.net-chef.com/. This url expires 5 minutes after it is generated; call the endpoint again to generate a new link if the file still needs to be downloaded. Only one of fileContent or fileUrl will be populated in the response.
          example: https://download.net-chef.com/attachment
        fileContent:
          type: string
          format: byte
          description: Base64 encoded data representing binary byte file. Only one of fileContent or fileUrl will be populated in the response.
        vendorInvoiceNumber:
          type: string
          description: Vendor Invoice/Reference Number.
          example: 91
        vendorCode:
          type: string
          description: Vendor or customer code associated with the attachment.
          example: KATSIR
        locationExportCode:
          type: string
          description: Location export code associated with the attachment.
          example: 0409
        vendorExportCode:
          type: string
          description: Vendor export code associated with the attachment.
          example: VREIN15
        uploadDate:
          type: string
          description: Date the attachment file was uploaded.
          example: 05/25/2021 08:11:18
      title: PbiAttachmentDto
      description: PbiAttachmentDto description
    PbiBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        pbiDetails:
          type: array
          items:
            $ref: '#/components/schemas/PbiDetailsGet'
        totalPages:
          type: integer
          format: int32
      title: PbiBatchResponseDto
      description: PbiBatchResponseDto description
    PbiDetailsList:
      type: object
      required:
      - locationCode
      properties:
        locationCode:
          type: string
          example: '000122'
          description: The Code that identifies the Location in Crunchtime.
        pbiDetails:
          type: array
          items:
            $ref: '#/components/schemas/PbiDetails'
      title: PbiDetailsList
      description: PbiDetailsList description
    PbiDetails:
      type: object
      properties:
        pbiDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/PbiDetailDto'
        pbiHeaderDetails:
          $ref: '#/components/schemas/PbiHeaderDto'
      title: PbiDetails
      description: PbiDetails description
    PbiAttachmentBatchResponseDto:
      type: object
      description: PbiAttachmentBatchResponseDto description
      properties:
        totalPages:
          type: integer
          format: int32
        hasNext:
          type: boolean
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/PbiAttachmentDto'
