openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Pbi Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Pbi Service
  description: The Purchase by Invoice Service is used to create and retrieve purchasing data that is not directly associated with products. Typically this Service is used to record expenses for services, like monthly cleaning charges, or other fixed fees like utilities.
paths:
  /pbi/v2/getAllPbis:
    get:
      tags:
      - Pbi Service
      summary: getAllPbisV2
      description: Retrieve a list of all >s.
      operationId: getAllPbisV2UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: invoiceDate
        in: query
        description: Invoice Date to retrieve in format DD-MMM-YY.
        required: true
        schema:
          type: string
      - name: invoiceNumber
        in: query
        description: Invoice number to retrieve.
        required: false
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PbiDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PbiDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: pbi not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /pbi/v2/getAttachmentsByPage:
    get:
      tags:
      - Pbi Service
      summary: getAttachmentsByPageV2
      description: Retrieves purchase by invoice records with the accompanying information (by page).
      operationId: getAttachmentsByPageV2
      parameters:
      - name: locationCode
        in: query
        description: Code for the Location to retrieve. Required if minutesSinceUpdate or one of vendorCode, or vendorInvoiceNumber is not provided.
        required: false
        example: DT-777
        schema:
          type: string
      - name: vendorCode
        in: query
        description: Code for the Vendor to retrieve. Required if minutesSinceUpdate or one of locationCode or vendorInvoiceNumber is not provided.
        required: false
        example: DARLIN
        schema:
          type: string
      - name: vendorInvoiceNumber
        in: query
        description: Vendor Invoice Number to retrieve. Required if minutesSinceUpdate or one of locationCode or vendorCode is not provided.
        required: false
        example: TEST1
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since the file was uploaded. Use to set how far back to search. Required if one of locationCode, vendorInvoiceNumber, or vendorCode is not provided.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Specifies the field to sort the attachments by. Default field 'fileName' (optional).
        required: false
        example: fileName
        schema:
          type: string
          enum:
          - fileName
          - fileDescription
          - fileSize
          - uploadDate
          - vendorInvoiceNumber
      - name: sortOrder
        in: query
        description: Specifies record sort order  in ascending (ASC) or descending (DESC) direction, Default ASC.(Optional).
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Retrieve one or more records by `pageNumber`. \n Use to retrieve data in smaller chunks. \n If left blank, the default is `1`.
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: traceabilityCode
        in: query
        description: Retrieve orders where the Traceability Code in the details matches the value provided (optional).
        required: false
        example: BFCA179A152023213
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of items to display per page.
        required: false
        schema:
          type: integer
          format: int32
      - name: includeNull
        in: query
        description: Specify 'true' to include null data elements in the output.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PbiAttachmentBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/PbiAttachmentBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: pbi attachments not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
