openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Nutrition Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Nutrition Service
  description: The Nutrition Service is used to create and retrieve data for Nutrition Product records.
paths:
  /nutrition/v1/getAllNutritions:
    get:
      tags:
      - Nutrition Service
      summary: getAllNutritions
      description: Retrieve a list of all Nutrition Details.
      operationId: getAllNutritionV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: Fetch all active Nutrition Details
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: includeUsda
        in: query
        description: Fetch either USDA or Custom Nutrition Details
        required: false
        schema:
          type: boolean
      - name: itemDescription
        in: query
        description: This is the Item Description of the Nutrition. Use 2 or more characters.
        required: false
        schema:
          type: string
      - name: itemNumber
        in: query
        description: 'This is the Item Number of the Nutrition '
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a Nutrition record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NutritionDetailsList'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NutritionDetailsList'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Nutrition not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /nutrition/v1/getNutritionsByPage:
    get:
      tags:
      - Nutrition Service
      summary: getNutritionsByPage
      description: Retrieve a list of Nutrition Details across multiple pages.
      operationId: getNutritionByPageV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: Fetch all active Nutrition Details
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: includeUsda
        in: query
        description: Fetch either USDA or Custom Nutrition Details
        required: false
        schema:
          type: boolean
      - name: itemDescription
        in: query
        description: This is the Item Description of the Nutrition. Use 2 or more characters.
        required: false
        schema:
          type: string
      - name: itemNumber
        in: query
        description: 'This is the Item Number of the Nutrition '
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a Nutrition record was last updated. Use to set how far back to search.
        required: false
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: pageNumber
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: pageSize
        in: query
        description: pageSize
        required: false
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/NutritionBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Nutrition not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /nutrition/v1/saveNutritions:
    post:
      tags:
      - Nutrition Service
      summary: saveNutritions
      description: Create or Update Nutrition records
      operationId: saveNutritionUsingPOST
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NutritionDetailsList'
        description: nutritionDetails
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: object
            application/json:
              schema:
                type: object
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
components:
  schemas:
    NutritionDetailsList:
      type: object
      properties:
        locationCode:
          type: string
          example: '000000'
          description: Location "Code" from Nutrition screen
        nutritionDetails:
          type: array
          items:
            $ref: '#/components/schemas/NutritionDetails'
      title: NutritionDetailsList
      description: NutritionDetailsList description
    NutritionDetailsDto:
      type: object
      required:
      - addedSugars
      - calcium
      - calories
      - cholesterol
      - dietaryFiber
      - iron
      - itemDescription
      - itemNumber
      - potassium
      - protein
      - saturatedFat
      - sodium
      - sugars
      - totalCarbohydrate
      - totalFat
      - transFat
      - vitaminA
      - vitaminC
      - vitaminD
      properties:
        active:
          type: string
        addedSugars:
          type: number
          example: 15
          description: '"Added Sugars g per 100g" from Nutrition screen.'
        calcium:
          type: number
          example: 15
          description: '"Calcium mg per 100g" from Nutrition screen.'
        calories:
          type: number
          example: 15
          description: '"Calories kCal per 100g" from Nutrition screen.'
        cholesterol:
          type: number
          example: 15
          description: '"Cholesterol mg per 100g" from Nutrition screen.'
        dietaryFiber:
          type: number
          example: 15
          description: '"Dietary Fiber g per 100g" from Nutrition screen.'
        iron:
          type: number
          example: 15
          description: '"Iron mg per 100g" from Nutrition screen.'
        itemDescription:
          type: string
          example: NUTRITION-TEST
          description: '"Item Description" from Nutrition screen.'
        itemNumber:
          type: string
          example: 123456
          description: '"Item Number" from Nutrition screen.'
        potassium:
          type: number
          example: 15
          description: '"Potassium mg per 100g" from Nutrition screen.'
        protein:
          type: number
          example: 15
          description: '"Protein g per 100g" from Nutrition screen.'
        saturatedFat:
          type: number
          example: 15
          description: '"Saturated Fat g per 100g" from Nutrition screen.'
        sodium:
          type: number
          example: 15
          description: '"Sodium mg per 100g" from Nutrition screen.'
        sugars:
          type: number
          example: 15
          description: '"Sugars g per 100g" from Nutrition screen.'
        totalCarbohydrate:
          type: number
          example: 15
          description: '"Total Carbohydrates g per 100g" from Nutrition screen.'
        totalFat:
          type: number
          example: 15
          description: '"Total Fat g per 100g" from Nutrition screen.'
        transFat:
          type: number
          example: 15
          description: '"Trans Fat g per 100g" from Nutrition screen.'
        usda:
          type: string
        vitaminA:
          type: number
          example: 15
          description: '"Vitamin A IU per 100g" from Nutrition screen.'
        vitaminC:
          type: number
          example: 15
          description: '"Vitamin C mg per 100g" from Nutrition screen'
        vitaminD:
          type: number
          example: 15
          description: '"Vitamin D IU per 100g" from Nutrition screen.'
      title: NutritionDetailsDto
      description: NutritionDetailsDto description
    NutritionBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        nutritionDetails:
          type: array
          items:
            $ref: '#/components/schemas/NutritionDetails'
        totalPages:
          type: integer
          format: int32
      title: NutritionBatchResponseDto
      description: NutritionBatchResponseDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    NutritionDetails:
      type: object
      properties:
        nutritionDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/NutritionDetailsDto'
      title: NutritionDetails
      description: NutritionDetails description
