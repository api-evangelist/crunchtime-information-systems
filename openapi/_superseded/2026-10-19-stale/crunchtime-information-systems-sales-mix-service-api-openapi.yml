components:
  schemas:
    SalesMixDetailsDto:
      type: object
      required:
      - daypartCode
      - glNumber
      - glValue
      - type
      properties:
        daypartCode:
          type: integer
          format: int64
          example: 33
          description: '"daypartCode" from salesmix.  Required for "Sales" and "Sales Tax" rows only. (Not used for other record types.)'
        glNumber:
          type: string
          example: 400001
          description: '"glNumber" from salesmix.  GL Number is not required (or) stored for Bank Deposits.'
        glValue:
          type: number
          example: 99999999.9999
          description: '"glValue" from salesmix'
        memo:
          type: string
          example: memo
          description: '"memo" from salesmix'
        type:
          type: integer
          format: int64
          example: 7
          description: '"type" from salesmix'
      title: SalesMixDetailsDto
      description: SalesMixDetailsDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    SalesMixBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        salesMixDetails:
          type: array
          items:
            $ref: '#/components/schemas/SalesMixDetailsGet'
        totalPages:
          type: integer
          format: int32
      title: SalesMixBatchResponseDto
      description: SalesMixBatchResponseDto description
    SalesMixHeaderDtoGet:
      type: object
      required:
      - registerNumber
      - transactionDate
      properties:
        bankDeposits:
          type: number
          example: 906
          description: '"bankDeposits" from Sales Mix'
        bookCash:
          type: number
          example: -375.6
          description: '"bookCash" from Sales Mix'
        cateringAccounts:
          type: number
          example: 0
          description: '"cateringAccounts" from Sales Mix'
        cateringSales:
          type: number
          example: 0
          description: '"cateringSales" from Sales Mix'
        chargedTips:
          type: number
          example: 99999999.9999
          description: '"chargedTips" from Sales Mix'
        complimentary:
          type: number
          example: 160.98
          description: '"complimentary" from Sales Mix'
        endingCount:
          type: integer
          format: int64
          example: 999999
          description: '"endingCount" from Sales Mix'
        grossSales:
          type: number
          example: 8685.03
          description: '"grossSales" from Sales Mix'
        middayCount:
          type: integer
          format: int64
          example: 999999
          description: '"middayCount" from Sales Mix'
        morningCount:
          type: integer
          format: int64
          example: 999999
          description: '"morningCount" from Sales Mix'
        numberOfVoids:
          type: integer
          format: int64
          example: 999999
          description: '"numberOfVoids" from Sales Mix'
        overShort:
          type: number
          example: 1281.6
          description: '"overShort" from Sales Mix'
        paidOuts:
          type: number
          example: 12.76
          description: '"paidOuts" from Sales Mix'
        paymentMedia1:
          type: number
          example: 8283.21
          description: '"paymentMedia1" from Sales Mix'
        paymentMedia2:
          type: number
          example: 82
          description: '"paymentMedia2" from Sales Mix'
        paymentMedia3:
          type: number
          example: 682.66
          description: '"paymentMedia3" from Sales Mix'
        registerNumber:
          type: string
          example: 2
          description: '"registerNumber" from Sales Mix'
        salesTax:
          type: number
          example: 568.21
          description: '"salesTax" from Sales Mix'
        taxExemptAmount:
          type: number
          example: 99999999.9999
          description: '"taxExemptAmount" from Sales Mix'
        taxableSales:
          type: number
          example: 8136.82
          description: '"taxableSales" from Sales Mix'
        totalNetSales:
          type: number
          example: 8116.82
          description: '"totalNetSales" from Sales Mix'
        totalOverrings:
          type: number
          example: 99999999.9999
          description: '"totalOverrings" from Sales Mix'
        totalVoidedAmount:
          type: number
          example: 99999999.9999
          description: '"totalVoidedAmount" from Sales Mix'
        transactionDate:
          type: string
          example: MM/dd/yyyy
          description: '"transactionDate" from Sales Mix'
        zReadingNumber:
          type: string
          example: 1
          description: '"zReadingNumber" from Sales Mix'
      title: SalesMixHeaderDtoGet
      description: SalesMixHeaderDtoGet description
    SalesMixDetailsGet:
      type: object
      properties:
        salesMixDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/SalesMixDetailsDto'
        salesMixHeaderDetails:
          $ref: '#/components/schemas/SalesMixHeaderDtoGet'
      title: SalesMixDetailsGet
      description: SalesMixDetailsGet description
    SalesMixDetails:
      type: object
      properties:
        salesMixDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/SalesMixDetailsDto'
        salesMixHeaderDetails:
          $ref: '#/components/schemas/SalesMixHeaderDto'
      title: SalesMixDetails
      description: SalesMixDetails description
    SalesMixDetailsList:
      type: object
      required:
      - locationCode
      properties:
        locationCode:
          type: string
          example: '000000'
          description: '"Code" from Company setup screen'
        salesMixDetails:
          type: array
          items:
            $ref: '#/components/schemas/SalesMixDetails'
      title: SalesMixDetailsList
      description: SalesMixDetailsList description
    SalesMixHeaderDto:
      type: object
      required:
      - registerNumber
      - transactionDate
      properties:
        chargedTips:
          type: number
          example: 99999999.9999
          description: The tips charged to a credit card.
        endingCount:
          type: integer
          format: int64
          example: 999999
          description: '"endingCount" from salesmix'
        middayCount:
          type: integer
          format: int64
          example: 999999
          description: '"middayCount" from salesmix'
        morningCount:
          type: integer
          format: int64
          example: 999999
          description: '"morningCount" from salesmix'
        numberOfVoids:
          type: integer
          format: int64
          example: 999999
          description: '"numberOfVoids" from salesmix'
        registerNumber:
          type: string
          example: 2
          description: '"registerNumber" from salesmix'
        taxExemptAmount:
          type: number
          example: 99999999.9999
          description: '"taxExemptAmount" from salesmix'
        totalOverrings:
          type: number
          example: 99999999.9999
          description: '"totalOverrings" from salesmix'
        totalVoidedAmount:
          type: number
          example: 99999999.9999
          description: '"totalVoidedAmount" from salesmix'
        transactionDate:
          type: string
          example: MM/dd/yyyy
          description: '"transactionDate" from salesmix'
        zReadingNumber:
          type: string
          example: 1
          description: '"zReadingNumber" from salesmix'
      title: SalesMixHeaderDto
      description: SalesMixHeaderDto description
