      - name: sortBy
        in: query
        description: Specifies the field used to sort the Daily Preps. Default is 'dailyPrepDate' if not provided (Optional).
        required: false
        example: description
        schema:
          type: string
          enum:
          - description
          - status
          - createUser
          - dailyPrepDate
          - templateName
          - templateLocationCode
          - cateringOrderFlag
          - dailyPrepApp
      - name: sortOrder
        in: query
        description: 'Specifies the sort direction for Daily Preps: ascending (ASC) or descending (DESC). Default is ASC if not specified (optional).'
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: includeNull
        in: query
        description: Specify `true` to include null data elements in output.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: pageNumber
        in: query
