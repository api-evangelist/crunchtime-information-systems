openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Daily Prep Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Daily Prep Service
  description: The Daily Prep Service allows you to create, update, finalize, cancel, or retrieve daily prep transactions.
paths:
  /dailyprep/v1/getAllDailyPreps:
    get:
      tags:
      - Daily Prep Service
      summary: getAllDailyPreps
      description: Retrieves all Daily Prep transactions with the accompanying information.
      operationId: getAllDailyPrepsV1UsingGET
      parameters:
      - name: locationCode
        in: query
        description: The Location where the Daily Prep transaction is created.
        required: true
        schema:
          type: string
      - name: dailyPrepDate
        in: query
        description: Date that the Daily Prep transaction is recorded for inventory (optional). If not provided, all transactions for the location with a prep date greater than or equal to the current date will be returned.
        required: false
        example: 08-FEB-26
        schema:
          type: string
      - name: status
        in: query
        description: Daily Prep status (Completed, Incomplete or Canceled) to retrieve (optional).
        required: false
        example: Incomplete
        schema:
          type: string
      - name: templateName
        in: query
        description: Template Name selected for the Daily Prep transaction (optional). Required if using Template Location Code.
        required: false
        schema:
          type: string
      - name: templateLocationCode
        in: query
        description: Template Location Code selected for the Daily Prep transaction (optional). Required if using Template Name.
        required: false
        schema:
          type: string
      - name: prepStation
        in: query
        description: Prep Station Name selected for the Daily Prep transaction (optional). This value is stored in recipe details.
        required: false
        schema:
          type: string
      - name: description
        in: query
        description: Daily Prep description (optional). The value is case-insensitive but must otherwise match exactly.
        required: false
        schema:
          type: string
      - name: prepLocation
        in: query
        description: Name of the Prep Customer selected for the Daily Prep transaction (optional).
        required: false
        schema:
          type: string
      - name: startTime
        in: query
        description: Start time of the Daily Prep transaction as selected when the transaction was created (optional). Format HH:mm (24hr)
        required: false
        example: '13:30'
        schema:
          type: string
      - name: createDate
        in: query
        description: Date that the Daily Prep transaction was created (optional).
        required: false
        example: 31-AUG-26
        schema:
          type: string
      - name: createUser
        in: query
        description: Application User who created the transaction (optional). The value is case-insensitive but must otherwise match exactly.
        required: false
        schema:
          type: string
      - name: completeDate
        in: query
        description: Date that the Daily Prep transaction was finalized (optional).
        required: false
        example: 25-JUL-26
        schema:
          type: string
      - name: completeUser
        in: query
        description: Application User who finalized the transaction (optional). The value is case-insensitive but must otherwise match exactly.
        required: false
        schema:
          type: string
      - name: cancelDate
        in: query
        description: Date that the Daily Prep transaction was canceled (optional).
        required: false
        example: 01-MAY-26
        schema:
          type: string
      - name: cancelUser
        in: query
        description: Application User who canceled the transaction (optional). The value is case-insensitive but must otherwise match exactly.
        required: false
        schema:
          type: string
      - name: dailyPrepApp
        in: query
        description: 'Application or process that created the Daily Prep transaction (optional). Current possible values: NC (Net-Chef), KS (KitchenSync), MM (Menu Mix) and UN (Undo Menu Mix).'
        required: false
        schema:
          type: string
      - name: autoPrepFlag
        in: query
        description: If true, retrieves Daily Prep transactions created by Menu Mix or Undo Menu Mix (optional).
        required: false
        schema:
          type: boolean
      - name: cateringOrderFlag
        in: query
        description: Filters Daily Prep transactions based on whether they include Catering Customer Orders (optional).
        required: false
        schema:
          type: boolean
      - name: addProjectedConsumptionFlag
        in: query
        description: Filters Daily Prep transactions based on whether they include additional Projected Consumption (optional).
        required: false
        schema:
          type: boolean
      - name: includeDetails
        in: query
        description: Retrieve all details (optional).
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: sortBy
        in: query
        description: Specifies the field used to sort the Daily Preps. Default is 'dailyPrepDate' if not provided (Optional).
        required: false
        example: description
        schema:
          type: string
          enum:
          - description
          - status
          - createUser
          - dailyPrepDate
          - templateName
          - templateLocationCode
          - cateringOrderFlag
          - dailyPrepApp
      - name: sortOrder
        in: query
        description: 'Specifies the sort direction for Daily Preps: ascending (ASC) or descending (DESC). Default is ASC if not specified (optional).'
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: includeNull
        in: query
        description: Specify 'true' to include null data elements in output.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyPrepDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyPrepDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Daily Prep transactions not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
