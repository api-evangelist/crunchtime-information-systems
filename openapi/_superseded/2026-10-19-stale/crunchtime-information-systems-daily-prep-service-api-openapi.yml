  /dailyprep/v1/saveDailyPreps:
    post:
      tags:
      - Daily Prep Service
      summary: saveDailyPreps (beta)
      description: Saves Daily Prep transactions for a location. Supports creating, updating, finalizing, or canceling a Daily Prep based on the `action` field.
      operationId: saveDailyPrepsUsingPOST
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyPrepDetailsList'
        description: dailyPreps
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DailyPrepDetailsList'
            application/json:
              schema:
                $ref: '#/components/schemas/DailyPrepDetailsList'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyPrepApiError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyPrepApiError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: Daily Prep transactions not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
components:
  schemas:
    DailyPrepDetailsList:
      type: object
      required:
      - locationCode
      - dailyPreps
      properties:
        locationCode:
          type: string
          example: AB121
          description: The Code for the Location associated with the Daily Prep. Required for all flows (create, edit, cancel).
        dailyPreps:
          type: array
          items:
            $ref: '#/components/schemas/DailyPrepSaveDto'
          description: Daily Prep records to save. Required for all flows (create, edit, cancel).
      title: DailyPrepDetailsList
      description: Daily prep records to save
    DailyPrepRecipeDto:
      type: object
      properties:
        productNumber:
          type: string
          example: R-123
          description: '"Product Number" from Daily Prep Screen''s Recipes Tab'
        name:
          type: string
          example: Test Recipe
          description: '"Recipe Name" from the Daily Prep screen''s Recipes tab'
        batchQty:
          type: number
          format: double
          example: 1.4
          description: '"Batch Qty" is the quantity produced in a single batch'
        batchUnit:
          type: string
          example: KG
          description: '"Batch Unit" is the unit of measure for the batch quantity'
        projectedConsumption:
          type: number
          format: double
          example: 10.53
          description: '"Projected Consumption" is the amount expected to be used during the day'
        suggestedProduction:
          type: number
          format: double
          example: 1
          description: '"Suggested Production" is the system-recommended quantity'
        actualProd:
          type: number
          format: double
          example: 23.01
          description: '"Actual Prod" is the actual quantity prepared'
        actualBatchCost:
          type: number
          format: double
          example: 63.1
          description: '"Actual Batch Cost" is the calculated cost of producing one batch'
        storageLocation:
          type: string
          example: Walk-In Cooler
          description: '"Storage Location" is the location where the prepared item is stored'
        prepStation:
          type: string
          example: Cold Prep
          description: '"Prep Station" is the kitchen station where the recipe is prepared'
        components:
          $ref: '#/components/schemas/DailyPrepComponentDto'
      title: DailyPrepRecipeDto
      description: Recipe details for a Daily Prep transaction
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    DailyPrepSaveDto:
      type: object
      required:
      - action
      properties:
        dailyPrepId:
          type: string
          example: f+zZA8P02QBuHFSyYdqz5g==
          description: Daily Prep Identifier. Required for edit and cancel flows (identifies the existing Daily Prep to update or cancel). Must be omitted on create — a new Daily Prep is generated.
        action:
          type: string
          example: SAVE
          description: 'Action to perform on the Daily Prep. Required for all flows. Allowed values: `SAVE` (save in Incomplete status), `FINALIZE` (save and finalize as Completed), `CANCEL` (cancel an existing Daily Prep — requires `dailyPrepId`).'
          enum:
          - SAVE
          - FINALIZE
          - CANCEL
        dailyPrepDate:
          type: string
          example: 02/20/2026
          description: Daily Prep Date in `MM/dd/yyyy` format — the date the Daily Prep is recorded for inventory. Required on create. Ignored on edit and cancel.
        startTime:
          type: string
          example: 09:00
          description: Start Time of the Daily Prep in `HH:mm` (24hr) format. Optional on create. Ignored on edit and cancel.
        description:
          type: string
          example: Daily Prep Desc
          description: Free-text Daily Prep description. Optional on create; if left blank, the system will populate this with the Daily Prep Date. Ignored on edit and cancel.
        prepLocation:
          type: string
          example: Prep Location
          description: Name of the Prep Location (Prep Customer) for the Daily Prep. Optional on create. Ignored on edit and cancel.
        recipes:
          type: array
          description: List of recipes included in the Daily Prep. Optional on create and edit. Ignored on cancel. On edit, only the recipes provided are updated; recipes already on the Daily Prep that are not included remain unchanged.
          items:
            type: object
            required:
            - productNumber
            - actualProd
            properties:
              productNumber:
                type: string
                example: R001
                description: Recipe identifier. Required for each entry in `recipes` (used to match the recipe being created or updated).
              actualProd:
                type: number
                format: double
                example: 23.01
                description: Planned production quantity for the recipe. Required for each entry in `recipes`. On edit, sending `null` removes the recipe from the Daily Prep.
      title: DailyPrepSaveDto
      description: "Daily prep record to save. Three flows are supported: \n- **Create** — omit `dailyPrepId`; `action` (`SAVE` or `FINALIZE`) and `dailyPrepDate` are required. \n- **Edit** — provide `dailyPrepId`; `action` (`SAVE` or `FINALIZE`) is required; other top-level fields are ignored. \n- **Cancel** — provide `dailyPrepId` and `action=CANCEL`; all other fields are ignored."
    DailyPrepDto:
      type: object
      properties:
        locationCode:
          type: string
          example: AB121
          description: '"Location Code" where the Daily Prep transaction is created'
        description:
          type: string
          example: Daily Prep description
          description: '"Description" is entered by the user when the transaction was created. If none was entered, this will be the Daily Prep Date.'
        status:
          type: string
          example: Incomplete
          description: '"Status" of the Daily Prep transaction. Possible values: Completed, Incomplete, or Canceled'
        createDate:
          type: string
          format: date
          example: 11/10/2020
          description: '"Create Date" is a date the transaction was created'
        createUser:
          type: string
          example: testuser
          description: '"Create User" is the user ID of the user who created the transaction'
        completeDate:
          type: string
          format: date-time
          example: 11/10/2020 07:47:05
          description: '"Complete Date" is a date with time the transaction was finalized'
        completeUser:
          type: string
          example: testuser
          description: '"Complete User" is the user ID of the user who finalized the transaction'
        cancelDate:
          type: string
          format: date-time
          example: 11/10/2020 14:24:51
          description: '"Cancel Date" is a date with time the transaction was canceled'
        cancelUser:
          type: string
          example: testuser
          description: '"Cancel User" is the user ID of the user who canceled the transaction'
        dailyPrepDate:
          type: string
          format: date-time
          example: 11/10/2020 13:45
          description: '"Daily Prep Date" is the date and time when the Daily Prep was performed, as selected by the user during creation'
        templateName:
          type: string
          example: Morning Prep
          description: '"Template Name" is the name of the Daily Prep template used for the transaction'
        templateLocationCode:
          type: string
          example: AB121
          description: '"Template Location Code" is the location code associated with the Daily Prep template'
        cateringOrder:
          type: string
          example: N
          description: '"Catering Order" indicates whether the prep transaction included Catering customer orders'
        dailyPrepApp:
          type: string
          example: NC
          description: '"Daily Prep App" is the application or process that created the Daily Prep transaction'
        prepLocation:
          type: string
          example: Main Kitchen
          description: '"Prep Location" is the name of the Prep Customer selected for the Daily Prep transaction'
        recipes:
          $ref: '#/components/schemas/DailyPrepRecipeDto'
      title: DailyPrepDto
      description: Daily Prep transaction details
    DailyPrepComponentDto:
      type: object
      properties:
        productNumber:
          type: string
          example: C1233
          description: '"Product Number" from Daily Prep Screen''s Components Tab'
        name:
          type: string
          example: Test Component
          description: '"Product Name" from Daily Prep Screen''s Components Tab'
        majorIngredient:
          type: string
          example: Y
          description: '"Major Ingredient" indicates whether the product is marked as a major ingredient in the recipe'
        quantity:
          type: number
          format: double
          example: 13.5
