      - name: dailyPrepApp
        in: query
        description: 'Application or process that created the Daily Prep transaction (optional). Current possible values: NC (Net-Chef), KS (KitchenSync), MM (Menu Mix) and UN (Undo Menu Mix).'
        required: false
        schema:
          type: string
      - name: autoPrepFlag
