                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
      operationId: getCustomerorderenhancedV1GetCustomerOrderEnhancedByPage
      x-operation-id-source: derived
