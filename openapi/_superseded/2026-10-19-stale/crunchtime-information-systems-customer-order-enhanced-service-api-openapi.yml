openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Customer Order Enhanced Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Customer Order Enhanced Service
  description: The Customer Order Enhanced service allows you to create and retrieve customer orders.
paths:
  /customerorderenhanced/v1/getAllCustomerOrderEnhanced:
    get:
      tags:
      - Customer Order Enhanced Service
      summary: getAllCustomerOrderEnhanced
      description: Retrieves all customer orders with the accompanying information.
      operationId: getAllCustomerOrderEnhancedV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: cateringOrderFlag
        in: query
        description: Retrieve orders with Catering Order Flag enabled (Y/N) - optional.
        required: false
        schema:
          type: boolean
      - name: customerCode
        in: query
        description: Code number for the Customer to retrieve. Required if Order Number or Order Date inputs not provided.
        required: false
        schema:
          type: string
      - name: daypartCode
        in: query
        description: Code number for the Daypart to retrieve (optional).
        required: false
        schema:
          type: integer
          format: int64
      - name: expectedDeliveryDate
        in: query
        description: Expected Delivery Date (DD-MMM-YY) for orders to retrieve (optional).
        required: false
        example: 01-JUL-21
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Use `true` to retrieve detailed information for one Customer Order at a time (optional). When `true`, `orderNumber` must be used.
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: invoiceDate
        in: query
        description: Invoice Date (DD-MMM-YY) for orders to retrieve (optional).
        required: false
        example: 30-JUN-21
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: true
        schema:
          type: string
      - name: orderDate
        in: query
        description: Order Date (DD-MMM-YY) for orders to retrieve. Required if Order Number or Customer Code inputs not provided.
        required: false
        example: 30-JUN-21
        schema:
          type: string
      - name: orderNumber
        in: query
        description: Order Number for order to retrieve. Required if Customer Code or Order Date inputs not provided.
        required: false
        schema:
          type: string
      - name: orderStatus
        in: query
        description: Order Status (SUBMITTED [18], PICKLISTED [19], INVOICED [2], CANCELED [4], FINAL RECONCILED [3]) for orders to retrieve (optional).
        required: false
        example: SUBMITTED
        schema:
          type: string
          enum:
          - SUBMITTED
          - '18'
          - PICKLISTED
          - '19'
          - INVOICED
          - '2'
          - CANCELED
          - '4'
          - FINALRECONCILED
          - '3'
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: Post Date (DD-MMM-YY) for orders to retrieve (optional).
        required: false
        example: 05-JUL-21
        schema:
          type: string
      - name: referenceNumber
        in: query
        description: Reference Number for order to retrieve (optional).
        required: false
        schema:
          type: string
      - name: revenueCenter
        in: query
        description: Revenue Center for transactions to retrieve (optional).
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrderEnhancedDetailsGet'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerOrderEnhancedDetailsGet'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: customer order enhanced not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /customerorderenhanced/v1/getCustomerOrderEnhancedByPage:
    get:
      tags:
      - Customer Order Enhanced Service
      summary: getCustomerOrderEnhancedByPage
      description: Retrieves all customer orders with the accompanying information by page number.
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: cateringOrderFlag
        in: query
        description: Retrieve orders with Catering Order Flag enabled (Y/N) - optional.
        required: false
        schema:
          type: boolean
      - name: customerCode
        in: query
        description: Code number of the Customer for orders to retrieve.
        required: false
        schema:
          type: string
      - name: daypartCode
        in: query
        description: Code number for the Daypart to retrieve (optional).
        required: false
        schema:
          type: integer
          format: int64
      - name: expectedDeliveryDate
        in: query
        description: Expected Delivery Date (DD-MMM-YY) for orders to retrieve (optional).
        required: false
        example: 01-JUL-21
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Use `true` to retrieve detailed information for one Customer Order at a time (optional).
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: invoiceDate
        in: query
        description: Invoice Date (DD-MMM-YY) for orders to retrieve (optional).
        required: false
        example: 30-JUN-21
        schema:
          type: string
      - name: locationCode
        in: query
        description: "The Code that identifies the Location in Crunchtime. \n Required if `orderNumber`, `orderDate` and `customerCode` not provided."
        required: false
        schema:
          type: string
      - name: orderDate
        in: query
        description: Order Date (DD-MMM-YY) for orders to retrieve. Required if Location Code, Order Number and Customer Code input not provided.
        required: false
        example: 30-JUN-21
        schema:
          type: string
      - name: orderNumber
        in: query
        description: Order Number of order to retrieve. Required if Location Code, Customer Code and Order Date input not provided.
        required: false
        schema:
          type: string
      - name: orderStatus
        in: query
        description: "Order Status (SUBMITTED [18], PICKLISTED [19], INVOICED [2], CANCELED [4], FINAL RECONCILED [3]) for orders to retrieve (optional).  \n Can use status description or code number"
        required: false
        example: SUBMITTED
        schema:
          type: string
          enum:
          - SUBMITTED
          - '18'
          - PICKLISTED
          - '19'
          - INVOICED
          - '2'
          - CANCELED
          - '4'
          - FINALRECONCILED
          - '3'
      - name: pageNumber
        in: query
        description: Retrieve one or more records by `pageNumber`. \n Use to retrieve data in smaller chunks. \n If left blank, the default is `1`.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: Post Date (DD-MMM-YY) for orders to retrieve (optional).
        required: false
        example: 05-JUL-21
        schema:
          type: string
      - name: referenceNumber
        in: query
        description: Reference Number for order to retrieve (optional).
        required: false
        schema:
          type: string
      - name: revenueCenter
        in: query
        description: Revenue Center for transactions to retrieve (optional).
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of items to display per page.
        required: false
        schema:
          type: integer
          format: int32
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CustomerOrderEnhancedBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOrderEnhancedBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: customer order enhanced not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
