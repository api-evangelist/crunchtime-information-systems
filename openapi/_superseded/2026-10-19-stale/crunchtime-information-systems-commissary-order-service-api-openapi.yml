      - name: orderDateStart
        in: query
        description: Retrieve orders with entry date equal to this date or later. Must be entered together with the end date.
        required: false
        example: 08-JAN-26 21:57:36
        schema:
          type: string
      - name: orderDateEnd
        in: query
        description: Retrieve orders with entry date equal to this date or earlier. Must be entered together with the start date.
        required: false
        example: 08-JAN-26 21:57:36
        schema:
          type: string
      - name: orderNumber
        in: query
        description: Order Number for order to retrieve.
        required: false
