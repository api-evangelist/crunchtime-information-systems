        schema:
          type: string
      - name: expectedDeliveryDateEnd
        in: query
        description: Retrieve orders with expected delivery date equal to this date or earlier (optional). Must be entered together with the start date.
        required: false
        example: 08-JAN-26
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Use `true` to retrieve detailed information for each Commissary Order (optional).
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: locationCode
        in: query
