openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Commissary Order Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Commissary Order Service
  description: The Commissary Order Service allows you to retrieve commissary orders.
paths:
  /commissaryorder/v1/getAllCommissaryOrders:
    get:
      tags:
      - Commissary Order Service
      summary: getAllCommissaryOrders
      description: Retrieves all commissary orders with the accompanying information.
      operationId: getAllCommissaryOrdersV1UsingGET
      parameters:
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: customerLocationCode
        in: query
        description: 'Code number for the Customer Location receiving the order (incoming commissary order). At least two of the following fields are required: locationCode, customerLocationCode, orderNumber, or orderDateStart/orderDateEnd.'
        required: false
        schema:
          type: string
      - name: expectedDeliveryDateStart
        in: query
        description: Retrieve orders with expected delivery date equal to this date or later (optional). Must be entered together with the end date.
        required: false
        example: 08-JAN-26
        schema:
          type: string
      - name: expectedDeliveryDateEnd
        in: query
        description: Retrieve orders with expected delivery date equal to this date or earlier (optional). Must be entered together with the start date.
        required: false
        example: 08-JAN-26
        schema:
          type: string
      - name: includeDetails
        in: query
        description: Use `true` to retrieve detailed information for one Commissary Order at a time (optional). When true,orderNumber must be used.
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: locationCode
        in: query
        description: 'Code number for the Commissary Location supplying the order (outgoing commissary order). At least two of the following fields are required: locationCode, customerLocationCode, orderNumber, or orderDateStart/orderDateEnd.'
        required: false
        schema:
          type: string
      - name: orderDateStart
        in: query
        description: 'Retrieve orders with entry date equal to this date or later. Must be entered together with the end date. At least two of the following fields are required: locationCode, customerLocationCode, orderNumber, or orderDateStart/orderDateEnd.'
        required: false
        example: 08-JAN-26 21:57:36
        schema:
          type: string
      - name: orderDateEnd
        in: query
        description: 'Retrieve orders with entry date equal to this date or earlier. Must be entered together with the start date. At least two of the following fields are required: locationCode, customerLocationCode, orderNumber, or orderDateStart/orderDateEnd.'
        required: false
        example: 08-JAN-26 21:57:36
        schema:
          type: string
      - name: orderNumber
        in: query
        description: 'Order Number for order to retrieve. At least two of the following fields are required: locationCode, customerLocationCode, orderNumber, or orderDateStart/orderDateEnd.'
        required: false
        schema:
          type: string
      - name: orderStatus
        in: query
        description: Order Status (NEW ORDER [1], SUBMITTED [18], PICKLISTED [19], INVOICED [2], CANCELED [4], PHYSICAL RECONCILED [7], FINAL RECONCILED [3]) for orders to retrieve (optional).
        required: false
        example: SUBMITTED
        schema:
          type: string
          enum:
          - NEWORDER
          - '1'
          - SUBMITTED
          - '18'
          - PICKLISTED
          - '19'
          - INVOICED
          - '2'
          - CANCELED
          - '4'
          - PHYSICALRECONCILED
          - '7'
          - FINALRECONCILED
          - '3'
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: Retrieve orders with post date equal this date (optional).
        required: false
        example: 08-JAN-26
        schema:
          type: string
      - name: referenceNumber
        in: query
        description: Reference Number for order to retrieve (optional).
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: sortBy
        in: query
        description: Specifies the field used to sort the Commissary Orders. Default is 'orderNumber' if not provided (Optional).
        required: false
        example: orderNumber
        schema:
          type: string
          enum:
          - orderPk
          - orderNumber
          - orderDate
          - invoiceDate
      - name: sortOrder
        in: query
        description: 'Specifies the sort direction for Commissary Orders: ascending (ASC) or descending (DESC). Default is ASC if not specified (Optional).'
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommissaryOrderDetails'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommissaryOrderDetails'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: commissary order not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /commissaryorder/v1/getCommissaryOrdersByPage:
    get:
      tags:
