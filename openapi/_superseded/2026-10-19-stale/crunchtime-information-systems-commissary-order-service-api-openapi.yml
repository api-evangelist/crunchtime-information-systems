        description: Retrieve orders with post date equal this date (optional).
        required: false
        example: 08-JAN-26
        schema:
          type: string
      - name: referenceNumber
        in: query
        description: Reference Number for order to retrieve (optional).
        required: false
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: sortBy
        in: query
        description: Specifies the field used to sort the Commissary Orders. Default is 'orderNumber' if not provided (Optional).
        required: false
