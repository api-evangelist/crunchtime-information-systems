        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorDetails'
          '*/*':
            schema:
              $ref: '#/components/schemas/VendorDetails'
        description: vendorDetails
        required: true
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: object
