openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Purchase Order Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Purchase Order Service
  description: The Purchase Order Service allows you to create and retrieve vendor order records.
paths:
  /purchaseorder/v1/getAllPurchaseOrders:
    get:
      tags:
      - Purchase Order Service
      summary: getAllPurchaseOrders
      description: Retrieves all vendor orders with the accompanying information.
      operationId: getAllPurchaseOrdersV1UsingGET
      parameters:
      - name: actualDeliveryDateEnd
        in: query
        description: Retrieve orders with actual delivery date equal to this date or earlier (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: actualDeliveryDateStart
        in: query
        description: Retrieve orders with actual delivery date equal to this date or later (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: expectedDeliveryDateEnd
        in: query
        description: Retrieve orders with expected delivery date equal to this date or earlier (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: expectedDeliveryDateStart
        in: query
        description: Retrieve orders with expected delivery date equal to this date or later (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: includeDetails
        in: query
        description: show order details or not. Default to False, if not provided.  Including details is available only if the purchase order number or the vendor invoice number are entered.
        required: false
        example: false
        schema:
          type: boolean
          default: false
      - name: invoiceDateEnd
        in: query
        description: Retrieve orders with invoice date equal to this date or earlier (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: invoiceDateStart
        in: query
        description: Retrieve orders with invoice date equal to this date or later (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: false
        example: DT-777
        schema:
          type: string
      - name: orderDateEnd
        in: query
        description: Retrieve orders with create date equal to this date or earlier (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021 21:57:36
        schema:
          type: string
      - name: orderDateStart
        in: query
        description: Retrieve orders with create date equal to this date or later (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021 21:57:36
        schema:
          type: string
      - name: orderType
        in: query
        description: The type of order to retrieve (optional; case sensitive)
        required: false
        example: VO or VR
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: postDate
        in: query
        description: Retrieve orders with post date equal this date (optional)
        required: false
        example: 05/02/2021
        schema:
          type: string
      - name: productNumber
        in: query
        description: Retrieve orders where the product number in the details is exactly equal to the provided value (optional).
        required: false
        example: TBPE3-3
        schema:
          type: string
      - name: purchaseOrderNumber
        in: query
        description: The system-assigned PO# of the order to retrieve (optional; case sensitive)
        required: false
        example: vo-98637
        schema:
          type: string
      - name: reconcileDateEnd
        in: query
        description: Retrieve orders with reconcile date equal to this date or earlier (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021 21:57:36
        schema:
          type: string
      - name: reconcileDateStart
        in: query
        description: Retrieve orders with reconcile date equal to this date or later (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021 21:57:36
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: status
        in: query
        description: Retrieve orders with inventory type status (New Order (Not sent) [1], Submitted [2], Confirmation of Receipt [6], Confirmation of Terms [7], Consolidated [8], Reconciled [3], Cancelled [4]) equal to this number (optional)
        required: false
        example: '3'
        schema:
          type: string
          enum:
          - '1'
          - '2'
          - '6'
          - '7'
          - '8'
          - '3'
          - '4'
      - name: submitDateEnd
        in: query
        description: Retrieve orders with submit date equal to this date or earlier (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021 21:57:36
        schema:
          type: string
      - name: submitDateStart
        in: query
        description: Retrieve orders with submit date equal to this date or later (optional).  Must be entered together with the start date and the range between the start and end must be no more than 31 days.
        required: false
        example: 05/02/2021 21:57:36
        schema:
          type: string
      - name: traceabilityCode
        in: query
        description: Retrieve orders where the traceability code in the details is exactly equal to the value provided (optional).
        required: false
        example: BFCA179A152023213
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User
        required: true
        schema:
          type: string
      - name: vendorCode
        in: query
        description: The Code number for the vendor's orders to retrieve (optional; case sensitive)
        required: false
        example: DARLIN
        schema:
          type: string
      - name: vendorInvoiceNumber
        in: query
        description: 'The vendor''s Invoice # for the order to retrieve (optional; case sensitive)'
        required: false
        example: DT-777
        schema:
          type: string
      - name: vendorProductName
        in: query
        description: Retrieve orders where the vendor product name in the details contains the provided value. The name must be at least 3 characters long (optional).
        required: false
        example: VendorProduct
        schema:
          type: string
      - name: vendorProductNumber
        in: query
        description: Retrieve orders where the vendor product number in the details is exactly equal to the provided value (optional).
        required: false
        example: TBPE3-3
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a record was last updated. Use to set how far back to search. Must be more than 0 and less than 10080 (7 days). Can be standalone parameter.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Specifies the field used to sort the Purchase Orders. Default is 'lastUpdated' if not provided (Optional)
        required: false
        example: lastUpdated
        schema:
          type: string
          enum:
          - orderPk
          - orderNumber
          - lastUpdated
          - submitDate
          - createDate
          - invoiceDate
      - name: sortOrder
        in: query
        description: 'Specifies the sort direction for Purchase Orders: ascending (ASC) or descending (DESC). Default is ASC if not specified (Optional)'
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrderHeaderDto'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrderHeaderDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: purchase orders not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /purchaseorder/v1/getAttachmentsByPage:
    get:
      tags:
      - Purchase Order Service
      summary: getAttachmentsByPage
      description: Retrieves purchase order attachment records with the accompanying information (by page).
      operationId: getAttachmentsByPageV1UsingGET
      parameters:
      - name: locationCode
        in: query
        description: Code for the Location to retrieve. Required if minutesSinceUpdate or one of purchaseOrderNumber, vendorCode, or vendorInvoiceNumber is not provided.
        required: false
        example: DT-777
        schema:
          type: string
      - name: purchaseOrderNumber
        in: query
        description: Purchase Order Number to retrieve. Required if minutesSinceUpdate or one of locationCode, vendorCode, or vendorInvoiceNumber is not provided.
        required: false
        example: vo-98637
        schema:
          type: string
      - name: vendorCode
        in: query
        description: Code for the Vendor to retrieve. Required if minutesSinceUpdate or one of locationCode, purchaseOrderNumber or vendorInvoiceNumber is not provided.
        required: false
        example: DARLIN
        schema:
          type: string
      - name: vendorInvoiceNumber
        in: query
        description: Vendor Invoice Number to retrieve. Required if minutesSinceUpdate or one of locationCode, purchaseOrderNumber or vendorCode is not provided.
        required: false
        example: TEST1
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since the file was uploaded. Use to set how far back to search. Must be more than 0 and less than 10080 (7 days). Required if one of locationCode, purchaseOrderNumber, vendorCode, or vendorInvoiceNumber is not provided.
        required: false
        schema:
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: Specifies the field to sort the attachments by. Default field 'fileName' (optional).
        required: false
        example: fileName
        schema:
          type: string
          enum:
          - purchaseOrderNumber
          - fileName
          - fileDescription
          - fileSize
          - uploadDate
      - name: sortOrder
        in: query
        description: Specifies record sort order  in ascending (ASC) or descending (DESC) direction, Default ASC.(Optional).
        required: false
        example: ASC
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: pageNumber
        in: query
        description: Retrieve one or more records by `pageNumber`. \n Use to retrieve data in smaller chunks. \n If left blank, the default is `1`.
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: traceabilityCode
        in: query
        description: Retrieve orders where the Traceability Code in the details matches the value provided (optional).
        required: false
        example: BFCA179A152023213
        schema:
          type: string
      - name: userid
        in: header
        description: '"User ID for the Crunchtime Application User.'
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of items to display per page.
        required: false
        schema:
          type: integer
          format: int32
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PurchaseOrderAttachmentBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderAttachmentBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: purchase order attachments not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
