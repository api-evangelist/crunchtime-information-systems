openapi: 3.2.0
info:
  description: Swagger documentation supporting mobile development of Crunchtime.
  version: '2.99'
  title: Inventory & Labor Vendor Product Pricing Service API
  termsOfService: http://springfox.io
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Vendor Product Pricing Service
  description: 'Project Read Me - API Descriptions (SOURCE OF TRUTH)

    Project Read Me - API Descriptions (SOURCE OF TRUTH)

    100%

    10

    Vendor Product Pricing Service

    1 of 2

    B22 Vendor Product Pricing Service [>]

    C22


    The Vendor Product Pricing Service allows users to “GET”, or retrieve extract product pricing data from Crunchtime.'
paths:
  /vendorproductpricing/v1/getAllVendorProductPricing:
    get:
      tags:
      - Vendor Product Pricing Service
      summary: getAllVendorProductPricing
      description: Retrieve all vendor products pricing.
      operationId: getAllVendorProductPricingV1UsingGET
      parameters:
      - name: activeProductFlag
        in: query
        description: Retrieve active products (optional). Default to Y, if not provided.
        required: false
        example: Y
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: bidSheet
        in: query
        description: Name of bid sheet to retrieve (optional) (case sensitive full name search).
        required: false
        example: Bid sheet(PA)
        schema:
          type: string
      - name: contractStatus
        in: query
        description: Retrieve products under contract (Y/N) - optional.
        required: false
        example: Y
        schema:
          type: string
      - name: effectiveDate
        in: query
        description: "Retrieve products relevant for this date (optional). API retrieves products with a beginDate less than or equal to the EffectiveDate and an endDate greater than the EffectiveDate. EffectiveDate is current date by default. \n Hint: If you want to see bids that end 'today', enter the date for the day before."
        required: false
        example: 11/10/2023
        schema:
          type: string
      - name: market
        in: query
        description: Name of market to retrieve (optional) (case sensitive full name search).
        required: false
        example: East (PA)
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a vendor product pricing or contract record was last updated. Use to set how far back to search.
        required: false
        example: 1440
        schema:
          type: integer
          format: int32
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: productName
        in: query
        description: Name of product to retrieve (optional) (case sensitive full name search).
        required: false
        example: Milk
        schema:
          type: string
      - name: productNumber
        in: query
        description: Product number to retrieve. (case sensitive).
        required: false
        example: P-010101
        schema:
          type: string
      - name: secondaryMarket
        in: query
        description: Retrieve products from secondary markets, if market param is provided. If market param is filled and secondaryMarket equals to "Y", API returns products not only from the market provided, but from secondary markets linked to the market, if there are any.
        required: false
        example: Y
        schema:
          type: string
      - name: substitute
        in: query
        description: Fetch substitute products (optional).
        required: false
        example: Y
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: vendor
        in: query
        description: Name of vendor to retrieve (optional) (case sensitive full name search).
        required: false
        example: Curtis Foods
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VendorProductPricingBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProductPricingBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
          description: vendor product pricing not found
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '500':
          description: Unexpected Error
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '503':
          description: System under maintenance
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '504':
          description: Timeout
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
  /vendorproductpricing/v1/getVendorProductPricingByPage:
    get:
