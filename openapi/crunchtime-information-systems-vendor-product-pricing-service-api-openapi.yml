components:
  schemas:
    VendorProductPricingDto:
      type: object
      properties:
        beginDate:
          type: string
          example: 11/10/2023
          description: '"Begin Date" of vendor product'
        bidSheet:
          type: string
          example: QGF000
          description: '"Bid Sheet" from Vendor Bids screen'
        contractStatus:
          type: string
          example: Y
          description: '"Contract Status" indicates (Y/N) whether the product has a contract'
        conversionToInventoryUnit:
          type: number
          example: 0,5
          description: '"Conversion Factor" from Vendor to Inventory unit.'
        endDate:
          type: string
          example: 11/10/2012
          description: '"End Date" of vendor product'
        inventoryUnit:
          type: string
          example: 12/12 OZ
          description: '"Inventory Unit" from Vendor Bids screen'
        lastChangeDate:
          type: string
          example: 11/10/2020
          description: '"Last Change Date" from Vendor Bids screen'
        market:
          type: string
          example: My Market
          description: '"Market Name" from Market screen'
        preferredUnit:
          type: string
          example: 12/12 OZ
          description: '"Preferred Unit" from Vendor Bids screen'
        price:
          type: number
          example: 100
          description: '"Price" from Vendor Bids screen'
        productBrand:
          type: string
          example: Nestle
          description: '"Product Brand" from Vendor Bids screen'
        productName:
          type: string
          example: My Company
          description: '"Company Product Name" from Company Products screen'
        productNumber:
          type: string
          example: '000222'
          description: '"Company Product Number" from Company Products screen'
        secondaryMarket:
          type: string
          example: Y
          description: '"Secondary Market Flag" shows relationship between markets.'
        secondaryVendorProducts:
          type: array
          description: '"Secondary Vendor Products" from Vendor Bids screen'
          items:
            $ref: '#/components/schemas/SecVendorProductPricingDto'
        splitFlag:
          type: string
          example: N
          description: '"Split" flag from Vendor Bids screen'
        usage:
          type: string
          example: 323
          description: '"Usage"'
        vendor:
          type: string
          example: My Vendor Company
          description: '"Vendor Name" from Vendor setup screen'
        vendorCode:
          type: string
          example: '000222'
          description: '"Vendor Code" from Vendor setup screen'
        vendorPackSize:
          type: string
          example: 12/12 OZ
          description: '"Vendor Pack Size" - Vendor Unit from Vendor Bids screen'
        vendorProductNumber:
          type: string
          example: p-0222
          description: '"Vendor Product Number" from Vendor Bids screen'
        contractLastChangeDate:
          type: string
          example: 11/10/2020 09:23:35
          description: '"Last Change Date" for Contract'
        taxCode:
          type: string
          example: T08
          description: '"Tax Code" from Vendor Bids screen'
        contractInfo:
          $ref: '#/components/schemas/ContractInfoDto'
      title: VendorProductPricingDto
      description: VendorProductPricingDto description
    VendorProductPricingBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        totalPages:
          type: integer
          format: int32
        vendorProductPricingRows:
          type: array
          items:
            $ref: '#/components/schemas/VendorProductPricingDto'
      title: VendorProductPricingBatchResponseDto
      description: VendorProductPricingBatchResponseDto description
    ContractInfoDto:
      type: object
      properties:
        referenceNumber:
          type: string
          example: AB123321
          description: '"Reference #" from Contract Info on Vendor Bids screenr'
        lineNumber:
          type: string
          example: '12'
          description: '"Line #" from Contract Info on Vendor Bids screen'
        expirationDate:
          type: string
          example: 11/10/2020
          description: '"Expiration Date" from Contract Info on Vendor Bids screen'
      title: ContractInfoDto
      description: ContractInfoDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    SecVendorProductPricingDto:
      type: object
      properties:
        beginDate:
          type: string
          example: 11/10/2023
          description: '"Begin Date" of vendor product'
        conversionToInventoryUnit:
          type: number
          example: 0,5
          description: '"Conversion Factor" from Vendor to Inventory unit.'
        endDate:
          type: string
          example: 11/10/2012
          description: '"End Date" of vendor product'
        lastChangeDate:
          type: string
          example: 11/10/2020
          description: '"Last Change Date" from Vendor Bids screen'
        price:
          type: number
          example: 100
          description: '"Price" from Vendor Bids screen'
        primaryAltPrimary:
          type: string
          example: Y
          description: '"Alternative Primary" flag from Vendor Bid Split and Secondary Vendor Products pop-up'
        productBrand:
          type: string
          example: Nestle
          description: '"Product Brand" from Vendor Bid Split and Secondary Vendor Products pop-up'
        splitFlag:
          type: string
          example: N
          description: '"Split" flag from Vendor Bid Split and Secondary Vendor Products pop-up'
        vendorPackSize:
          type: string
          example: 12/12 OZ
          description: '"Vendor Pack Size" - Vendor Unit from Vendor Bid Split and Secondary Vendor Products pop-up'
        vendorProductName:
          type: string
          example: My Milk
          description: '"Vendor Product Name" from Vendor Bid Split and Secondary Vendor Products pop-up'
        vendorProductNumber:
          type: string
          example: p-0222
          description: '"Vendor Product Number" from Vendor Bid Split and Secondary Vendor Products pop-up'
        substitute:
          type: string
          example: Y
          description: '"Substitute" flag from Vendor Bid Split and Secondary Vendor Products pop-up'
        substituteNotApproved:
          type: string
          example: N
          description: '"Not Approved" flag from Vendor Bid Split and Secondary Vendor Products pop-up'
        substituteRestricted:
          type: string
          example: Y
          description: '"Restricted" flag from Vendor Bid Split and Secondary Vendor Products pop-up'
        taxCode:
          type: string
          example: T08
          description: '"Tax Code" from Vendor Bid Split and Secondary Vendor Products popup'
      title: SecVendorProductPricingDto
      description: SecVendorProductPricingDto description
