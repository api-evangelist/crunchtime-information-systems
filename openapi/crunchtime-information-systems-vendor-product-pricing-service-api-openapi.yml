      operationId: getVendorProductPricingByPageV1UsingGET
      parameters:
      - name: activeProductFlag
        in: query
        description: Retrieve active products (optional). Default to Y, if not provided.
        required: false
        example: Y
        schema:
          type: string
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: bidSheet
        in: query
        description: Name of bid sheet to retrieve (optional) (case sensitive full name search).
        required: false
        example: Bid sheet(PA)
        schema:
          type: string
      - name: contractStatus
        in: query
        description: Retrieve products under contract (Y/N) - optional.
        required: false
        example: Y
        schema:
          type: string
      - name: effectiveDate
        in: query
        description: "Retrieve products relevant for this date (optional). API retrieves products with a beginDate less than or equal to the EffectiveDate and an endDate greater than the EffectiveDate. EffectiveDate is current date by default. \n Hint: If you want to see bids that end 'today', enter the date for the day before."
        required: false
        example: 11/10/2023
        schema:
          type: string
      - name: market
        in: query
        description: Name of market to retrieve (optional) (case sensitive full name search).
        required: false
        example: East (PA)
        schema:
          type: string
      - name: minutesSinceUpdate
        in: query
        description: The number of minutes since a vendor product pricing or contract record was last updated. Use to set how far back to search.
        required: false
        example: 1440
        schema:
          type: integer
          format: int32
      - name: pageNumber
        in: query
        description: "Retrieve one or more records by `pageNumber`. \n Use to retrieve data in smaller chunks. \n If left blank, the default is `1`."
        required: false
        example: 1
        schema:
          type: integer
          format: int32
          default: 1
      - name: substitute
        in: query
        description: Fetch substitute products (optional).
        required: false
        example: Y
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: productName
        in: query
        description: Name of product to retrieve (optional) (case sensitive full name search).
        required: false
        example: Milk
        schema:
          type: string
      - name: productNumber
        in: query
        description: Product number to retrieve. (case sensitive).
        required: false
        example: P-010101
        schema:
          type: string
      - name: secondaryMarket
        in: query
        description: Retrieve products from secondary markets, if market param is provided. If market param is filled and secondaryMarket equals to "Y", API returns products not only from the market provided, but from secondary markets linked to the market, if there are any.
        required: false
        example: Y
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: vendor
        in: query
        description: Name of vendor to retrieve (optional) (case sensitive full name search).
        required: false
        example: Vendor 02 (PA)
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: pageSize
        in: query
        description: Number of items to display per page.
        required: false
        schema:
          type: integer
          format: int32
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VendorProductPricingBatchResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/VendorProductPricingBatchResponseDto'
        '400':
          description: Validation Error
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ObjectError'
        '401':
          description: Authorization
          content:
            '*/*':
              schema:
                type: string
            application/json:
              schema:
                type: string
        '404':
