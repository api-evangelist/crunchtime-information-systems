components:
  schemas:
    SupplementalWageDetailsList:
      type: object
      required:
      - locationCode
      properties:
        locationCode:
          type: string
          example: '000122'
          description: The Code that identifies the Location in Crunchtime.
        supplementalWageDetails:
          type: array
          items:
            $ref: '#/components/schemas/SupplementalWageDetails'
      title: SupplementalWageDetailsList
      description: SupplementalWageDetailsList description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    SupplementalWageDetailDto:
      type: object
      required:
      - employeeNumber
      - hourlyFlag
      - laborDate
      - lumpSumFlag
      - supplementalWageCode
      properties:
        dateTimeFormat:
          type: string
        employeeNumber:
          type: string
          example: 000-R01
          description: Employee number for the employee associated with the supplemental wage.
        hourlyFlag:
          type: string
          example: Y
          description: Indicates (Y/N) whether the supplemental wage should be paid for a number of hours.
        hourlyValue:
          type: number
          example: 9.1
          description: The number of hours for which the supplemental wage should be paid.
        laborDate:
          type: string
          example: MM/dd/yyyy
          description: The date for which the supplemental wage should be paid.
        lumpSumFlag:
          type: string
          example: Y
          description: Indicates (Y/N) whether the supplemental wage should be paid as a lump sum.
        lumpSumValue:
          type: number
          example: 10.2
          description: The lump sum value of the supplemental wage to be paid.
        posCode:
          type: string
          example: 000-R01
          description: The POS ID number of the employee associated with the supplemental wage.
        supplementalWageCode:
          type: string
          example: PTO1
          description: The Code number of the supplemental wage entry.
        dailyLumpSumFlag:
          type: string
          example: Y
          description: Indicates (Y/N) whether the supplemental wage should be paid as a daily lump sum.
        dailyLumpSumValue:
          type: number
          example: 1050.25
          description: The daily lump sum value of the supplemental wage to be paid. The value must be a number between 0.00 and 99,999.99 (or between -99,999.99 and 99,999.99 if flagged as Tip Credit Eligible) and contain no more than 2 decimal places.
      title: SupplementalWageDetailDto
      description: SupplementalWageDetailDto description
    SupplementalWageDetails:
      type: object
      properties:
        supplementalWageDetailDetails:
          type: array
          items:
            $ref: '#/components/schemas/SupplementalWageDetailDto'
        supplementalWageHeaderDetails:
          $ref: '#/components/schemas/SupplementalWageHeaderDto'
      title: SupplementalWageDetails
      description: SupplementalWageDetails description
    SupplementalWageHeaderDto:
      type: object
      required:
      - locationCode
      properties:
        dateTimeFormat:
          type: string
        locationCode:
          type: string
          example: 123456
          description: The Location Code for the location associated with the supplemental wage.
      title: SupplementalWageHeaderDto
      description: SupplementalWageHeaderDto description
    SupplementalWageBatchResponseDto:
      type: object
      properties:
        hasNext:
          type: boolean
        supplementalWageDetails:
          type: array
          items:
            $ref: '#/components/schemas/SupplementalWageDetails'
        totalPages:
          type: integer
          format: int32
      title: SupplementalWageBatchResponseDto
      description: SupplementalWageBatchResponseDto description
