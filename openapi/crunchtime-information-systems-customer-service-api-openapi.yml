openapi: 3.2.0
info:
  title: Crunchtime Information Systems Customer Service API
  contact:
    name: Crunchtime Development Team
    url: http://www.crunchtime.com
    email: apiquestions@crunchtime.com
  license:
    name: Apache License Version 2.0
    url: https://github.com/springfox/springfox/blob/master/LICENSE
  termsOfService: http://springfox.io
  version: '1.0'
  description: 'Operations tagged Customer Service across 2 of this provider''s published API definitions: crunchtime-information-systems-cruise-platform-openapi.yml, crunchtime-information-systems-inventory-labor-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: //webservices-test.net-chef.com
tags:
- name: Customer Service
  description: The Customer Service can be used to create a “Customer” that is an establishment or outlet to which a Crunchtime Location sells or distributes products and/or produced Recipe items. It may be an outlet within the Location or an entirely external entity, e.g. a “catering” Customer. “Customer” records are required to “issue” items to these entities via “Customer Order” transactions.
paths:
  /cruise/customer/v1/getAllCustomers:
    get:
      tags:
      - Customer Service
      summary: getAllCustomers
      description: 'Retrieve a list of customer account details.

        Retrieve one customer''s account details using `customerAccountNumber` and `customerCode`.'
      operationId: getAllCustomerRecordsV1UsingGET
      parameters:
      - name: activeFlag
        in: query
        description: Use `true` to retrieve only active Customers.
        required: false
        schema:
          type: boolean
      - name: authenticationtoken
        in: header
        description: Secure token for API authentication.
        required: true
        schema:
          type: string
      - name: customerAccountNumber
        in: query
        description: The Account Number associated with the Customer.
        required: false
        schema:
          type: string
      - name: customerCode
        in: query
        description: The Code that identifies the Customer in Crunchtime.
        required: false
        schema:
          type: string
      - name: locationCode
        in: query
        description: The Code that identifies the Location in Crunchtime.
        required: false
        schema:
          type: string
      - name: password
        in: header
        description: Password for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: sitename
        in: header
        description: Crunchtime site identifier. (test or production)
        required: true
        schema:
          type: string
      - name: userid
        in: header
        description: User ID for the Crunchtime Application User.
        required: true
        schema:
          type: string
      - name: X-B3-TraceId
        in: header
        description: Optional trace identifier for troubleshooting.
        required: false
        schema:
          type: string
      - name: includeNull
        in: query
        description: Specify 'true' to output null data elements.
        required: false
        allowEmptyValue: true
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDetailsRes'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDetailsRes'
        '400':
          description: Validation Error
          content:
            '*/*':
