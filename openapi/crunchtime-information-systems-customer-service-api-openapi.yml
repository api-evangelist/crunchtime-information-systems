components:
  schemas:
    CustomerDetailsDtoReq:
      type: object
      required:
      - address1
      - city
      - country
      - customerCode
      - customerName
      - locationCode
      - supplyPricing
      properties:
        activeFlag:
          type: string
          example: Y
          description: '"activeFlag" from Customer'
        address1:
          type: string
          example: 100 Main Street1
          description: '"address1" from Customer'
        address2:
          type: string
          example: 100 Main Street2
          description: '"address2" from Customer'
        city:
          type: string
          example: BOSTON
          description: '"city" from Customer'
        country:
          type: string
          example: USA
          description: '"country" from Customer'
        customerAccountNumber:
          type: string
          example: 860 536-4589 428
          description: '"customerAccountNumber" from Customer'
        customerCode:
          type: string
          example: 030292
          description: '"customerCode" from Customer'
        customerName:
          type: string
          example: Melissa's Vendor
          description: '"customerName" from Customer'
        deleteFlag:
          type: string
          example: Y
          description: '"deleteFlag" from Customer'
        exportCode:
          type: string
          example: EXP1
          description: '"exportCode" from Customer'
        importCode:
          type: string
          example: new_imp_code1
          description: '"importCode" from Customer'
        locationCode:
          type: string
          example: 123456
          description: '"locationCode" from Customer'
        retailPricing:
          type: string
          example: STAN
          description: '"retailPricing" from Customer'
        state:
          type: string
          example: IN
          description: '"state" from Customer'
        supplyPricing:
          type: string
          example: COST PLUS
          description: '"supplyPricing" from Customer'
        zipcode:
          type: string
          example: '02114'
          description: '"zipcode" from Customer'
      title: CustomerDetailsDtoReq
      description: CustomerDetailsDto description
