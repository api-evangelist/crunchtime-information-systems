components:
  schemas:
    ScheduleDto:
      type: object
      properties:
        employeeNumber:
          type: string
          example: 0000000285
          description: The Employee Number for the scheduled employee/shift.
        employeePosCode:
          type: string
          example: 314005
          description: The POS Code for the scheduled employee/shift.
        endDatetime:
          type: string
          format: date-time
          example: 06/05/2012 10:00:00
          description: The End Date & Time for the employee's scheduled shift.
        laborDate:
          type: string
          example: 20120605
          description: The Labor Date for the schedule.
        locationCode:
          type: string
          example: 7654
          description: The Code for the Location associated with the schedule.
        positionCode:
          type: string
          example: 110
          description: The Position Code for the scheduled employee/shift.
        positionName:
          type: string
          example: CLEANING (GT)
          description: The Position Name for the scheduled employee/shift.
        startDatetime:
          type: string
          format: date-time
          example: 06/05/2012 06:00:00
          description: The Start Date & Time for the employee's scheduled shift.
      title: ScheduleDto
      description: ScheduleDto description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    EmployeeGet:
      type: object
      required:
      - dateHired
      - dateOfBirth
      - employeeNumber
      - firstName
      - lastName
      - payType
      - status
      properties:
        address1:
          type: string
          example: 200 Main Street
          description: '"Address" from Employee setup screen

            Alphanumeric (30) Reference Data for the employee''s Net-Chef Profile'
        address2:
          type: string
          description: Not in use
        age:
          type: integer
          format: int32
          example: 29
          description: Age
        allergies:
          type: string
          description: 'Employee''s allergies (free text field)

            Alphanumeric (25) Reference Data for the employee''s Net-Chef Profile'
        breakWaiver:
          type: string
          example: Y
          description: 'Employee has signed a break waiver or not.  Impacts Employee Break reports and Labor Actuals.

            Alphanumeric (1) If populated, must be ‘Y’ or ‘N’. If not populated, will set to ‘N’ for new records; will not update existing records'
          enum:
          - N
          - Y
        broadcastSchedule:
          type: string
          example: Y
          description: Should the weekly labor schedule be emailed to this employee (Y/N)
          enum:
          - N
          - Y
        city:
          type: string
          example: Anywhere
          description: 'Now storing city as character data

            Alphanumeric (40) Reference Data for the employee''s Net-Chef Profile'
        country:
          type: string
          example: USA
          description: 'Country

            Alphanumeric (40) Reference Data for the employee''s Net-Chef Profile'
        createUser:
          type: integer
          format: int64
          example: 10000003
          description: User that created the employee (FK to t_user)
        dateCreate:
          type: string
          format: date
          example: 04/17/2012
          description: Date the employee was created
        dateEdit:
          type: string
          format: date
          example: 11/30/2016
          description: Date the employee was last edited
        dateEditUtc:
          type: string
          example: '2021-08-12T10:21:46'
          description: Date the employee was last edited in UTC
        dateHired:
          type: string
          format: date
          example: 02/01/2012
          description: '"Date Hired" from Employee setup screen

            Date (mm/dd/yyyy) Reference Data for the employee''s Net-Chef Profile'
        dateOfBirth:
          type: string
          format: date
          example: 07/30/1991
          description: '"Date of Birth" from Employee setup screen

            Date (mm/dd/yyyy) Used by the employee as part of Teamworx login authentication'
        dateTerminated:
          type: string
          format: date
          example: 12/31/9999
          description: '"Date Terminated" from Employee setup screen

            Date (mm/dd/yyyy) Reference Data for the employee''s Net-Chef Profile'
        editUser:
          type: integer
          format: int64
          example: 10000001
          description: User that last edited the employee (FK to t_user)
        eligibleForRehire:
          type: string
          example: false
          description: 'Is this employee eligible for rehire (Y/N)

            Alphanumeric (1) If populated, must be ‘Y’ or ‘N’'
          enum:
          - 'false'
          - 'true'
        emailAddress:
          type: string
          description: 'Employee''s email address

            Alphanumeric (75) Reference data - Employee''s Email Address'
        emergencyContactName:
          type: string
          description: 'Name of person to contact in the event of an emergency regarding this employee

            Alphanumeric (40) Reference Data for the employee''s Net-Chef Profile'
        emergencyContactPhone:
          type: string
          description: 'Phone number of person to contact in the event of an emergency regarding this employee

            Alphanumeric (30) Reference Data for the employee''s Net-Chef Profile'
        employeeAudits:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeAudit'
        employeeChecklistItem01:
          type: string
          description: 'Check List Item 1

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem02:
          type: string
          description: 'Check List Item 2

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem03:
          type: string
          description: 'Check List Item 3

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem04:
          type: string
          description: 'Check List Item 4

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem05:
          type: string
          description: 'Check List Item 5

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem06:
          type: string
          description: 'Check List Item 6

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem07:
          type: string
          description: 'Check List Item 7

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem08:
          type: string
          description: 'Check List Item 8

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem09:
          type: string
          description: 'Check List Item 9

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeChecklistItem10:
          type: string
          description: 'Check List Item 10

            Alphanumeric (40) Reference Data associated to the "New Hire Checklist" configured in Enterprise Manager'
        employeeLocations:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeLocation'
        employeeNickname:
          type: string
          description: 'Employee nickname

            Alphanumeric (20) Must not contain characters other than letters, numbers, spaces and the following special characters: single quote, hyphen or underline. Reference Data for the employee''s Net-Chef Profile and visible on the schedule'
        employeeNumber:
          type: string
          example: AUTO-0000000004
          description: '"Employee Number" from Employee setup screen

            Alphanumeric (40) Must be unique globally. Primary key to make updates against an employees profile, meaning it cannot be updated /save calls'
        employeePositions:
          type: array
          items:
            $ref: '#/components/schemas/EmployeePosition'
        ethnicGroup:
          type: string
          description: 'Employee''s ethnic group

            Alphanumeric (10) Code for the "Ethnic Group" from Enterprise Manager'
        federalAdditionalWithholding:
          type: number
          example: 0
          description: 'Employee''s additional withholding (federal taxation purposes)

            Number (8,2) Reference Data for the employee''s Net-Chef Profile'
        federalExemptions:
          type: integer
          format: int64
          example: 0
          description: 'Employee''s additional withholding (federal taxation purposes)

            Number (3,0) Reference Data for the employee''s Net-Chef Profile'
        federalMaritalStatus:
          type: string
          example: SINGLE
          description: 'Employee''s federal marital status

            Alphanumeric (10) Code for the "Marital Status" from Enterprise Manager'
        firstName:
          type: string
          example: John
          description: '"First Name" from Employee setup screen

            Alphanumeric (40) "First Name" for the Employee Profile'
        flexField01:
          type: string
          description: 'Flexible Field 1

            Alphanumeric (30) Data for the selected Flex Field from the Net-Chef Employee record. Integrators are responsible for knowing which values belong in which "flexField" #s'
        flexField02:
          type: string
          description: 'Flexible Field 2

            Alphanumeric (30) Data for the selected Flex Field from the Net-Chef Employee record. Integrators are responsible for knowing which values belong in which "flexField" #s'
        flexField03:
          type: string
          description: 'Flexible Field 3

            Alphanumeric (30) Data for the selected Flex Field from the Net-Chef Employee record. Integrators are responsible for knowing which values belong in which "flexField" #s'
        flexField04:
          type: string
          description: 'Flexible Field 4

            Alphanumeric (30) Data for the selected Flex Field from the Net-Chef Employee record. Integrators are responsible for knowing which values belong in which "flexField" #s'
        flexField05:
