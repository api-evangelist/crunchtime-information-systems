    EmployeeLocation:
      type: object
      required:
      - locationCode
      properties:
        activeFlag:
          type: string
          example: Y
          description: 'activeFlag

            Alphanumeric (1) If populated, must be ‘Y’ or ‘N’. If not populated, will be set to ‘Y’ cannot be ''N'' for the employee''s primary location.Indicates whether the employee is "active" at the (non-primary) location.If the employee/location relationship is not active, the employee is ineligible to work at the location'
          enum:
          - N
          - Y
        allocateLaborTo:
          type: string
          example: N
          description: 'Allocate labor indicator

            Alphanumeric (1) If populated, must be ‘Y’ or ‘N’. If not populated, will be set to ‘N’.If ‘Y’, this record must come after a record where this value =‘N’.Indicates whether this location will be used when allocating labor data for multiple locations that the employee has worked'
          enum:
          - N
          - Y
        deleteFlag:
          type: string
          example: N
          description: deleteFlag
          enum:
          - N
          - Y
        employeeNumber:
          type: string
          example: 1
          description: employeeNumber
        id:
          type: integer
          format: int64
          example: 17
          description: Unique Identifier
        locationCityName:
          type: string
          example: Anywhere
          description: '"City" selected in the Location/Company setup screen'
        locationCode:
          type: string
          example: 7654
          description: 'Location Code

            Alphanumeric (6) Must match an existing locationCode from /getAllLocations'
        locationMarketName:
          type: string
          description: '"Market" selected in the Location/Company setup screen (if any)'
        locationName:
          type: string
          example: AUTOMATION THREE
          description: '"Name" from the Location/Company setup screen'
        locationStateName:
          type: string
          example: MASSACHUSETTS
          description: '"State/Province" selected in the Location/Company setup screen (if any)'
        posExportFlag:
          type: boolean
          example: false
          description: Export indicator
        posId:
          type: string
          example: 247160
          description: 'POS ID

            Alphanumeric (40) Must not be the POS ID for any other Employee/Location. This will default to the employeeNumber by default unless otherwise entered to match the employee ID used in the POS. For the saveTimeClockEnhanced API endpoint, the Location "posId" must be provided as the "employeeNumber"'
        primaryLocationFlag:
          type: boolean
          example: true
          description: 'Is Primary location for user working shift

            At least one Location must be flagged as Primary'
      title: EmployeeLocation
      description: EmployeeLocation description
    EmployeeBatchResponseDto:
      type: object
      properties:
        employeeDetails:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeGet'
        hasNext:
          type: boolean
          example: true
          description: has Next
        totalPages:
          type: integer
          format: int32
          example: 10
          description: Total Pages
      title: EmployeeBatchResponseDto
      description: EmployeeBatchResponseDto description
    EmployeePosition:
      type: object
      required:
      - posCode
      - positionCode
      properties:
        altLocationsFlag:
          type: string
          description: 'altLocationsFlag

            Alphanumeric (1) If populated, must be ‘Y’ or ‘N’. Allows employee to work this position at any non-primary Location. If ''N'', an employee can only work that Position at their primary Location'
          enum:
          - N
          - Y
        deleteFlag:
          type: string
          example: N
          description: 'deleteFlag

            Alphanumeric (1) If populated, must be ‘Y’ or ‘N’. An employee must have/retain at least one Position, flagged as "primaryPositionFlag": "Y".You can also "delete" an Employee/Position record by excluding it from the current "save" input'
          enum:
          - N
          - Y
        employeeNumber:
          type: string
          example: 1
          description: employeeNumber
        id:
          type: integer
          format: int64
          description: Unique Identifier
        payRate:
          type: number
          description: 'Pay Rate

            Number (12,4) Required if employee “Pay Type” is ‘Hourly’'
        payRateDefault:
          type: number
          description: Default pay rate for this position
        payRateMaximum:
          type: number
          description: Maximum pay rate for this position
        payRateMinimum:
          type: number
          description: Minimum pay rate for this position
        payrollCode:
          type: string
          description: 'Payroll code

            Alphanumeric (3) Reference Position Code that could be used in payroll exports'
        posCode:
          type: string
          description: 'POS Code

            Alphanumeric (10) Position Code that''s used in the POS. The posCode is validated against the saveTimeClockEnhanced. Will default to the "positionCode"'
        positionCode:
          type: string
          description: 'Code describing position

            Alphanumeric (10) Must match a Position Code configured in the Enterprise Manager Positions module'
        positionGlDescription:
          type: string
          description: GL to which this position is mapped
        positionGlSubstructure:
          type: string
        positionName:
          type: string
          description: Full description of position
        positionPlGroupingCode:
          type: string
        positionPlGroupingDesc:
          type: string
        primaryPositionFlag:
          type: string
          description: 'Primary Position Flag

            At least one Position must be flagged as Primary'
          enum:
          - N
          - Y
        skillLevelCode:
          type: integer
          format: int64
          description: 'skillLevelCode

            Number (3) Must match a code configured in the Enterprise Manager Skill Levels module'
        skillLevelDescription:
          type: string
        wageMatrix:
          type: integer
          format: int64
          description: 'Wage Matrix assigned to the location

            Number (3) Required if the employee’s primary location is associated with an active wage matrix that has passed its first effective date'
