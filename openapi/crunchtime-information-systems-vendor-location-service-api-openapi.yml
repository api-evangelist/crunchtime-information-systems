components:
  schemas:
    VendorLocationDetailsList:
      type: object
      required:
      - locationCode
      properties:
        locationCode:
          type: string
          example: '000122'
          description: '"locationCode"'
        vendorLocationDetails:
          type: array
          items:
            $ref: '#/components/schemas/VendorLocationDetails'
      title: VendorLocationDetailsList
      description: VendorLocationDetailsList description
    VendorLocationDetails:
      type: object
      properties:
        scheduleOverrideRowList:
          type: array
          items:
            $ref: '#/components/schemas/VendorLocationScheduleOverrideDetails'
        vendorLocationHeaderDetails:
          $ref: '#/components/schemas/VendorLocationHeaderDto'
        vendorLocationOtherDetail:
          $ref: '#/components/schemas/VendorLocationOtherDetailsDto'
        vendorLocationScheduleDetail:
          $ref: '#/components/schemas/VendorLocationScheduleDetailDto'
        vendorLocationTransmissionDetail:
          $ref: '#/components/schemas/VendorLocationTransmissionDetailDto'
      title: VendorLocationDetails
      description: VendorLocationDetails description
    ObjectError:
      type: object
      properties:
        arguments:
          type: array
          items:
            type: object
        code:
          type: string
        codes:
          type: array
          items:
            type: string
        defaultMessage:
          type: string
        objectName:
          type: string
      title: ObjectError
    VendorLocationTransmissionDetailDto:
      type: object
      required:
      - locationCode
      - vendorCode
      properties:
        accountNumber:
          type: string
          example: 1234567890
          description: '"Account Number" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        accrualFlag:
          type: string
          example: Y
          description: '"Accrual" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        allowSimpleReceiptFlag:
          type: string
          example: Y
          description: '"Allow SR" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        autoReconcileEinvoiceFlag:
          type: string
          example: Y
          description: '"Auto-Reconcile" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        allowVOFlag:
          type: string
          example: Y
          description: '"Allow VO" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        codFlag:
          type: string
          example: Y
          description: '"COD" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        electronicInvoiceFlag:
          type: string
          example: Y
          description: '"E.Invoice" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        enforceMinimums:
          type: string
          example: Y
          description: '"Enforce Minimums" flag from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
          enum:
          - N
          - Y
        locationCode:
          type: string
          example: '000122'
          description: Location "Code" from Company setup screen.
        minimumCases:
          type: string
          example: 10
          description: '"Min. # of Cases" from Vendor Location Details.'
        minimumValue:
          type: string
          example: 500
          description: '"Min. Value" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        orderAlert:
          type: string
          example: High Priority
          description: '"Order Alert" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        orderVendorUnitofMeasure:
          type: string
          example: Unit1
          description: '"Order V. OUM" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        referenceNumber:
          type: string
          example: REF-001
          description: '"Reference Number" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        userName:
          type: string
          example: john_doe
          description: '"User Name" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        userPassword:
          type: string
          example: P@ssw0rd
          description: '"Password" from Vendor Location Details. If the field value is null, the previously saved value will remain. To erase it, please enter ''#DELETE'' value.'
        vendorCode:
          type: string
